decisions_taken:
- id: Q1
  question: The requirement asks for an `architecture/decisions/ADR-*` file "naming"
    the decision. Decisions are numbered per issue, so `DD-2` alone is not unique
    across the project.
  resolution: A project-scoped decision is recorded when its block in the design cites
    an ADR id whose file exists in `architecture/decisions/`, or when a file there
    names both the issue's slug and the decision id. A citation of a missing file
    does not count (DSR-8).
  by: spec-author
  stage: refine
  status: open
- id: Q2
  question: The requirement says every decision carries a scope. Should a decision
    with no scope line be refused?
  resolution: No. Only a declared `project` scope is refused. Every design written
    before 7.0.0 has no scope line, and refusing those would block their landings.
    The template asks for the line, so new designs carry it.
  by: spec-author
  stage: refine
  status: open
- id: Q3
  question: 'The release-line refusal fires only when the issue''s stored generation
    sets `release_line: true`. Does this refusal need a field like that?'
  resolution: 'No. It fires only on a decision that declares `Scope: project`, and
    no design in the archive declares one (checked with a search of `docs/compass/*/technical-design.md`
    on 18 October 2026). An author who writes the line asks for the check.'
  by: spec-author
  stage: refine
  status: open
- id: Q4
  question: The requirement says the reproduction is the define stage's record. The
    catalogue lists `bug-report` at stage `assess`.
  resolution: The catalogue keeps `assess`. The report states the defect at intake,
    and the hotfix's reproduce-first define stage writes the failing test against
    it. Moving the stage would change when every project's bug report is due.
  by: spec-author
  stage: refine
  status: open
