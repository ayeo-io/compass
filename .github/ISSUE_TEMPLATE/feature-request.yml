name: Feature request
description: Something Compass should do that it does not do now.
labels: [enhancement]
body:
  - type: input
    id: version
    attributes:
      label: Compass version
      description: The output of `compass --version`.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
