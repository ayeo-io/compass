# Dependabot version updates. Workflow actions are pinned to commit SHAs, and
# Dependabot alerts do not cover SHA-pinned actions, so this keeps them current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /examples/bdd-adapters/cucumber-js
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /examples/bdd-adapters/godog
    schedule:
      interval: weekly
