# Automatic review of every pull request by Claude.
#
# Review only: the job can read the code and post comments, and its tool
# list holds no command that commits or pushes. It reviews against
# CLAUDE.md, the house rules every change in this repository must meet,
# and the review rules in governance/review-rules.yml that match the
# changed files, taken from the base branch.
# It authenticates by identity federation: GitHub's OIDC token is swapped
# for a short-lived Anthropic token under a federation rule, so no key is
# stored. The ids are repository variables, not secrets.
#
# `main` needs this job's check instead of a human approval, so the job
# fails unless Claude returns the verdict PASS. Claude returns it as
# structured output, a field rather than comment text, and a missing
# verdict fails too. The action does not review a pull request that
# changes this file, so such a pull request has no verdict: its check is
# red and it needs an admin to merge it after reading it.
name: claude-review

# Turned off by the maintainer on 2026-10-03 (governance/decisions,
# `ci-review-manual-only`). No pull request starts it, and `main` no longer
# needs its check. Started by hand it is skipped, because the job reads
# the pull request it reviews. To turn it back on, replace the trigger with
#   pull_request:
#     types: [opened, synchronize, ready_for_review]
# and add `review` back to the protected-main ruleset's required checks.
on:
  workflow_dispatch:

# A newer push to the same pull request makes the older review pointless.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A draft is not ready for review, and a fork gets no OIDC token for
    # this repository's federation rule.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      # The review rules that match the changed files, printed by the base
      # branch's CLI from the base branch's rules file, so a pull request
      # cannot change the rules it is reviewed against. Values the pull
      # request controls reach the script through env only.
      - id: rules
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          BASE="$RUNNER_TEMP/base"
          git worktree add --detach "$BASE" FETCH_HEAD
          # The files API, not `gh pr diff`: the diff is refused past 300
          # files, and it quotes a non-ASCII name. A command substitution,
          # so a failure stops the step instead of emptying the list.
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          files=()
          while IFS= read -r f; do [ -n "$f" ] && files+=("$f"); done <<< "$names"
          # The files API stops at 3,000 files without an error, so a short
          # list would review the rest with no rules.
          # Compared as strings, so an empty or non-numeric count fails too.
          if [ "${#files[@]}" != "$CHANGED_FILES" ]; then
            case "$CHANGED_FILES" in
              ''|*[!0-9]*)
                echo "The event gave no usable changed-file count (got '$CHANGED_FILES'), so the review rules cannot be checked as complete. Push a new commit to start a run with a new event." >&2 ;;
              *)
                if [ "${#files[@]}" -ge 3000 ] && [ "${#files[@]}" -lt "$CHANGED_FILES" ]; then
                  echo "The files API listed ${#files[@]} of $CHANGED_FILES changed files: it stops at 3,000 files, so the review rules would be incomplete. Split the pull request, or a person reads it and merges it as an admin." >&2
                else
                  echo "The files API listed ${#files[@]} of $CHANGED_FILES changed files. The count likely comes from before a newer push, whose own run reviews it. Running this job again reuses its count, so push a new commit if no newer run started." >&2
                fi ;;
            esac
            exit 1
          fi
          if [ -f "$BASE/governance/review-rules.yml" ] && [ "${#files[@]}" -gt 0 ]; then
            text=$(python3 "$BASE"/cli/compass policy review-rules \
              --rules "$BASE/governance/review-rules.yml" --changed-files "${files[@]}")
          else
            text="The base branch has no review rules for these files."
          fi
          delim="RULES_$(openssl rand -hex 16)"
          { echo "rules<<$delim"; echo "$text"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - id: review
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The branch is checked out in the
            working directory. Read CLAUDE.md first: its house rules apply
            to every file, commit message and pull-request body.

            Look for, in this order:
            1. Defects the change introduces: wrong behaviour, a test that
               cannot fail, a check that can be bypassed.
            2. Breaches of CLAUDE.md: an em dash, any line crediting an
               agent, an idiom, American spelling (except "artifact"), an
               id or reference a reader cannot resolve.
            3. Claims in the pull-request body that the diff or the
               recorded evidence does not support.
            4. Breaches of the review rules below, taken from the base
               branch for the files this pull request changes. Cite each
               breach by its RR- id. A rule marked "not blocking" alone
               does not make the verdict FAIL. Never report what a
               rule's "Do not flag" line permits.

            REVIEW RULES:
            ${{ steps.rules.outputs.rules }}

            Report only problems this pull request introduces. Say what is
            wrong, where (file and line), and the smallest fix. Write in
            plain British English, with no em dash.

            Post findings with
            mcp__github_inline_comment__create_inline_comment (with
            confirmed: true) for a specific line, and gh pr comment for
            one summary that starts with PASS or FAIL. Do not change any
            file, commit, or push. Do not add any line crediting Claude or
            any other agent to a comment.

            Return the same verdict as your result: PASS when this pull
            request introduces no defect, no breach of CLAUDE.md and no
            breach of a blocking review rule, otherwise FAIL. The merge waits on it.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","FAIL"]}},"required":["verdict"]}'

      - name: Fail unless the verdict is PASS
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          verdict=$(printf '%s' "$RESULT" | python3 -c 'import json, sys
          try:
              print(json.load(sys.stdin).get("verdict", ""))
          except Exception:
              print("")')
          if [ "$verdict" != "PASS" ]; then
            echo "Claude's review verdict is '${verdict:-missing}', not PASS. See its summary comment on the pull request."
            exit 1
          fi
          echo "Claude's review verdict is PASS."
