# Compass framework repo - its own CI.
#
# This checks the Compass framework repository itself: the repo structure,
# the governance YAML, and the CLI. It is also the live proof of the reference
# workflow in ci/github-actions.yml - a project copies that one; this is the
# framework running its own checks on itself.
#
# The whole test suite runs once for each pull request, in the merge queue
# (the `merge_group` event), on the exact commit that then lands on main. It
# runs as parallel shards plus one serial job. A push to a pull request runs
# fast jobs only: `checks`, `count` and `fast-tests`, which runs the test
# files the pull request changes and the house-rule tests. A draft runs
# none of them. The `self-check` job at the end is the check the
# protected-main ruleset needs. On a pull request it passes when the fast
# jobs succeeded; in a merge group, only when every suite job succeeded and
# the shards' test counts add up to the whole suite's count. A push to main
# skips every job when a merge-group run tested the same commit green.
# docs/releasing.md ("Continuous integration") describes the jobs; the
# decision is governance/decisions/2026-11-01-the-full-suite-runs-in-the-merge-queue.md.

name: Compass (self-check)

on:
  pull_request:
    # `edited` because GitHub sends it when the base branch changes, and a
    # run tests the head merged into the base, so the fast jobs must run
    # again then. On a title or body edit they skip and self-check reports
    # the earlier result instead (see the self-check job).
    # `ready_for_review` because a draft runs no test (see `fast-tests`), so
    # marking it ready must run them.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # The merge queue's run of the whole suite. The required checks must report
  # here too, or the queue waits for them.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# The token these jobs get. Declared rather than inherited: without this block
# the workflow runs with whatever the repository or organisation default is,
# which on many repositories is a read-write token. Compass runs commands a
# project declares in its governance file, so the token handed to that runner
# is part of what a compromised command could reach. Reading the checkout is
# all these jobs need; already-tested adds two read scopes of its own.
permissions:
  contents: read

# One group per pull request, so a new push cancels the run it replaces. A
# merge group and a push to main get a group per commit and are never
# cancelled: GitHub cancels a merge group's run itself when the group is
# rebuilt. The prefix keeps this group apart from other workflows' groups: a
# group name is shared by every workflow in the repository. A title or body
# edit gets a group of its own (the `-text` suffix), so it never cancels a
# run of the fast jobs; a base change shares the pushes' group and cancels
# the run it supersedes.
concurrency:
  group: compass-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'edited' && github.event.changes.base == null && '-text' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job but already-tested needs it. Three kinds of run:
# - a pull request runs `checks`, `count` and `fast-tests`. Each carries
#   `!github.event.pull_request.draft`, so a draft runs none, and
#   `(github.event.action != 'edited' || github.event.changes.base != null)`,
#   so a title or body edit runs none; a base change runs them, because a
#   run tests the head merged into the base;
# - a merge group runs `checks`, `count` and every suite job: the shards,
#   `serial`, `check-mutation` and the adapter jobs. Each
#   suite job carries `github.event_name != 'pull_request'`;
# - a push to main runs what a merge group runs, unless already-tested says
#   a merge group tested this commit green; then every job skips together.
# Every job carries `!cancelled() && needs.already-tested.outputs.skip !=
# 'true'`. `!cancelled()` is a status function, so GitHub does not add the
# implicit success() that would skip a job whose need (already-tested,
# skipped except on a push) was skipped. self-check drops the event and
# edit parts and runs on every pull request event, whatever the other
# jobs' results were, because a skipped required check counts as passed.
jobs:
  already-tested:
    # A push to main whose commit the merge queue already tested green with
    # the whole suite skips every other job. scripts/ci-already-tested.py
    # holds the rule.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read           # this workflow's merge-group runs and their jobs
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      # Third-party actions are pinned by SHA, with the human-readable version
      # in a comment so Dependabot can bump them. See docs/security.md on the
      # supply-chain stance - what the framework asks its consumers to do, the
      # framework's own CI does too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - id: decide
        name: Did the merge queue already test this commit green?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ci-already-tested.py --repo "$REPO" --commit "$MERGED" --this-run "$RUN_ID" --output "$GITHUB_OUTPUT"

  checks:
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # compass ci --since compares with the base branch

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: No rival product name in commit messages
        # governance/decisions/2026-10-04-rival-names-never-committed.md. The
        # test suite scans tracked files and paths; this step scans the
        # commit messages it cannot see. The title and body are scanned by
        # pr-text.yml, on every edit too.
        # A merge group scans the commits it adds to main.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        # `shell: bash` runs with pipefail, so a failed `git log` fails the
        # step instead of handing the gate empty input.
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            git log --format=%B "$BASE_SHA..$HEAD_SHA" | python3 scripts/rival-name-gate.py --text -
          elif [ -n "${BEFORE_SHA//0/}" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git log --format=%B "$BEFORE_SHA..$AFTER_SHA" | python3 scripts/rival-name-gate.py --text -
          else
            git log -1 --format=%B "$AFTER_SHA" | python3 scripts/rival-name-gate.py --text -
          fi

      - name: Install the test runner and the optional JSON Schema validator
        # PyYAML travels inside the plugin (cli/vendor/yaml/); tests/conftest.py
        # resolves it the same way the CLI does, so there is nothing to install
        # for it here. jsonschema turns on full JSON Schema validation in the
        # lint commands (optional).
        run: pip install -r .github/requirements/self-check.txt

      - name: Repo structure check
        # scripts/validate.sh checks the directory tree, that commands
        # reference skills/agents/templates that exist, and that the kit layer
        # is intact.
        run: bash scripts/validate.sh

      - name: CLI syntax
        run: python3 -c "import ast; ast.parse(open('cli/compass').read())"

      - name: Compass gate suite
        # `compass policy lint` in practice: it proves the shipped governance
        # YAML is valid and the CLI runs. It does not run the tests; the
        # shard and serial jobs do.
        # On a pull request, compare the decisions ledger with the base
        # branch, so an edited entry fails here (ADR-027); in a merge group,
        # with the commit the group is built on. On a push there is no base
        # to compare with, and compass ci says it skipped the check.
        env:
          BASE_REF: ${{ github.base_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 cli/compass ci --since "origin/$BASE_REF"
          elif [ -n "$GROUP_BASE" ]; then
            python3 cli/compass ci --since "$GROUP_BASE"
          else
            python3 cli/compass ci
          fi

  count:
    # The number of tests the shards must add up to. On a pull request it is
    # the fast check that every test file in the suite still collects.
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    outputs:
      total: ${{ steps.count.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the same checkout the shards collect from
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the test runner
        run: pip install -r .github/requirements/self-check.txt
      - id: count
        name: Count the tests outside the serial pass
        shell: bash
        run: |
          python3 -m pytest --collect-only -q -m "not serial" tests/ > "$RUNNER_TEMP/collected.txt"
          total=$(python3 scripts/ci-self-check.py count "$RUNNER_TEMP/collected.txt")
          echo "The whole suite collects $total tests outside the serial pass."
          echo "total=$total" >> "$GITHUB_OUTPUT"

  fast-tests:
    # On a pull request: the test files the pull request changes and the
    # house-rule tests, listed by scripts/ci-fast-tests.py, instead of the
    # whole suite, which the merge queue runs once. A draft and a title or
    # body edit run none.
    needs: already-tested
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the change list, and the guards that read history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the test runner
        run: pip install -r .github/requirements/self-check.txt
      - name: List the test files this pull request runs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-fast-tests.py --base "$BASE_SHA" --head "$HEAD_SHA" > "$RUNNER_TEMP/fast-files.txt"
      - name: Run their tests on parallel workers
        shell: bash
        run: |
          mapfile -t files < "$RUNNER_TEMP/fast-files.txt"
          python3 -m pytest -p xdist.plugin -n auto -m "not serial" "${files[@]}"
      - name: Run their tests marked serial alone
        # pytest exits 5 when it collects no test: these files hold no
        # serial test, which is not a failure.
        shell: bash
        run: |
          mapfile -t files < "$RUNNER_TEMP/fast-files.txt"
          status=0
          python3 -m pytest -m serial "${files[@]}" || status=$?
          if [ "$status" -eq 5 ]; then status=0; fi
          exit "$status"

  shard:
    # The parallel pass, split by test file. The matrix below is the one
    # place the number of shards is set: each leg passes strategy.job-total
    # to the shard command and names its count file with it, so self-check
    # reads the same number.
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # Plugin autoload is disabled for the same reason `make test` disables
    # it: third-party pytest plugins sometimes hang on a clean machine, so
    # pytest-xdist is loaded by name.
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because two guards compare a file against a
          # named earlier commit: tests/test_printed_strings_unchanged.py
          # reads every printed line as it was before the writing-style pass,
          # and tests/test_manifest_rename.py reads tracked content. A shallow
          # clone has neither commit, so `git show <sha>:<path>` fails for
          # every file and the guard compares nothing. It says so rather than
          # passing - "no shell file was compared" is its own self-check - and
          # that is exactly how this was found, on the first run in
          # continuous integration.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the test runner
        run: pip install -r .github/requirements/self-check.txt
      - name: List this shard's test files
        run: python3 scripts/ci-shard.py "$SHARD" "$SHARDS" > "$RUNNER_TEMP/shard-files.txt"
      - name: Count this shard's tests
        shell: bash
        run: |
          mapfile -t files < "$RUNNER_TEMP/shard-files.txt"
          [ "${#files[@]}" -gt 0 ] || { echo "Shard $SHARD has no test files."; exit 1; }
          python3 -m pytest --collect-only -q -m "not serial" "${files[@]}" > "$RUNNER_TEMP/collected.txt"
          mkdir -p "$RUNNER_TEMP/count"
          python3 scripts/ci-self-check.py count "$RUNNER_TEMP/collected.txt" > "$RUNNER_TEMP/count/shard-$SHARD-of-$SHARDS"
          echo "Shard $SHARD of $SHARDS holds ${#files[@]} files and collects $(cat "$RUNNER_TEMP/count/shard-$SHARD-of-$SHARDS") tests."
      # --durations=0 with --durations-min=0 prints every test's duration, the
      # ones under pytest's default 0.005 s floor included, so
      # scripts/ci-durations.py can rebuild tests/ci-durations.json, the shard
      # weights, from this run with a time for every test file.
      - name: Run this shard's tests
        shell: bash
        run: |
          mapfile -t files < "$RUNNER_TEMP/shard-files.txt"
          python3 -m pytest -p xdist.plugin -n auto -m "not serial" --durations=0 --durations-min=0 "${files[@]}"
      # Published only after the tests pass, so a failed, cancelled or
      # skipped shard leaves no count and the aggregator fails on that too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-count-${{ matrix.shard }}
          path: ${{ runner.temp }}/count/shard-${{ matrix.shard }}-of-${{ strategy.job-total }}
          retention-days: 1
          if-no-files-found: error

  serial:
    # Tests marked serial assert wall-clock limits or change this checkout's
    # own files, so they run alone on a runner of their own.
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the test runner
        run: pip install -r .github/requirements/self-check.txt
      - name: Tests marked serial
        run: python3 -m pytest tests/ -m serial --durations=20

  self-check:
    # The required check. Its rule depends on the kind of run:
    # - in a merge group, and on a push to main that was not already tested,
    #   it passes only when every suite job succeeded, `fast-tests` skipped
    #   and the shards' counts add up to the count job's total;
    # - on a pull request, it passes when `checks`, `count` and `fast-tests`
    #   succeeded and every suite job skipped;
    # - on a draft, no test ran, and it passes saying so. A draft cannot
    #   merge or join the merge queue, and marking it ready runs the tests.
    # It needs the other required jobs too, so its result carries theirs.
    #
    # On a title or body edit every needed job skips, and GitHub counts a
    # skipped required check as passed and reads the latest check run of
    # each name. So self-check does not skip there, which would hide an
    # earlier failure: it runs, and passes only when the latest run of this
    # pull request on the head that ran `checks` succeeded and the base has
    # not changed since that run was created. Text-edit, draft and
    # cancelled runs do not count. While that run is still running, the
    # step waits for it, up to 55 minutes, so an edit made during a push
    # run reports that run's result instead of failing at once. The wait is
    # why the job may run 60 minutes. scripts/ci-already-tested.py holds
    # that rule.
    needs:
      - already-tested
      - checks
      - count
      - fast-tests
      - shard
      - serial
      - check-mutation
      - bdd-adapter
      - bdd-adapter-behave
      - bdd-adapter-cucumber-js
      - bdd-adapter-godog
      - atdd-adapter-python
      - atdd-adapter-typescript
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      checks: read
      issues: read            # the pull request's timeline
      actions: read           # the pull request's workflow runs and their jobs
    # Every step but the text-edit one keeps the 5-minute limit the whole
    # job had before the wait was added.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        timeout-minutes: 5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        # A missing count must reach the rule below, not stop the job here.
        continue-on-error: true
        with:
          pattern: shard-count-*
          path: ${{ runner.temp }}/count
          merge-multiple: true
      - name: Every needed job succeeded and the shard counts add up
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/ci-self-check.py aggregate
          --needs-env NEEDS
          --needed checks,count,shard,serial,check-mutation,bdd-adapter,bdd-adapter-behave,bdd-adapter-cucumber-js,bdd-adapter-godog,atdd-adapter-python,atdd-adapter-typescript
          --skipped fast-tests
          --exempt already-tested --counts "$RUNNER_TEMP/count"
      - name: The fast jobs succeeded and the suite jobs skipped
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null)
        timeout-minutes: 5
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/ci-self-check.py aggregate
          --needs-env NEEDS
          --needed checks,count,fast-tests
          --skipped shard,serial,check-mutation,bdd-adapter,bdd-adapter-behave,bdd-adapter-cucumber-js,bdd-adapter-godog,atdd-adapter-python,atdd-adapter-typescript
          --exempt already-tested
      - name: A draft runs no test
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        timeout-minutes: 5
        run: echo "This pull request is a draft, so no test ran. Mark it ready for review to run the tests."
      - name: A title or body edit reports the earlier result
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.action == 'edited' && github.event.changes.base == null
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ci-already-tested.py --repo "$REPO" --pull-request "$NUMBER" --head "$HEAD" --this-run "$RUN_ID" --wait-minutes 55

  # ---------------------------------------------------------------------------
  # The BDD reference adapter, in its own job and its own environment.
  #
  # pytest-bdd is a pytest PLUGIN, and the shard and serial jobs above
  # deliberately run with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 - third-party
  # plugins sometimes hang on init in a clean environment. Under that setting
  # pytest-bdd never loads, so the adapter test would skip, forever, and a
  # permanently-skipped test is a green tick over an assertion nobody ran.
  #
  # So the adapter gets a job where autoload is ON and pytest-bdd is installed,
  # while the main suite keeps its two dependencies (jsonschema, pytest) and
  # its autoload-off setting. Both properties are asserted by
  # tests/test_bdd_adapter_reference.py.
  # ---------------------------------------------------------------------------
  bdd-adapter:
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the test tooling and the BDD runner
        run: pip install -r .github/requirements/bdd-adapter.txt

      - name: Extract the spec into a runnable feature file
        working-directory: examples/bdd-adapters/pytest-bdd
        run: python3 ../../../cli/compass bdd extract --issue reset-password

      - name: Run the extracted scenarios
        # No PYTEST_DISABLE_PLUGIN_AUTOLOAD here, on purpose: pytest-bdd must
        # load for the scenarios to be collected at all.
        working-directory: examples/bdd-adapters/pytest-bdd
        run: python3 -m pytest tests/ -v

      - name: Prove the adapter ran rather than skipped
        # A second check: if pytest-bdd ever fails to load, collection returns
        # zero scenarios and pytest exits 5. Catch that here rather than
        # reading a green tick that means nothing.
        working-directory: examples/bdd-adapters/pytest-bdd
        run: |
          python3 -m pytest tests/ -q --collect-only > /tmp/collected.txt
          grep -q "test_" /tmp/collected.txt || {
            echo "No scenarios were collected - pytest-bdd did not load."; exit 1; }

      - name: Run the suite's own pytest-bdd adapter tests, and fail on a skip
        # The shard jobs have no pytest-bdd, so these tests skip there,
        # and a stale feature-file path went unseen (#407). Here pytest-bdd
        # is installed, so a skip means a test did not run. `shell: bash`
        # adds pipefail, so a failing run is not hidden by the pipe to tee.
        shell: bash
        run: |
          python3 -m pytest -rs --color=no -p no:cacheprovider \
            tests/test_bdd_adapter_reference.py \
            "tests/test_bdd_adapters_all.py::test_trc_a2_each_adapter_should_run_the_extracted_feature_and_pass[pytest-bdd]" \
            | tee /tmp/adapter-tests.txt
          ! grep -q "^SKIPPED" /tmp/adapter-tests.txt || {
            echo "An adapter test skipped where pytest-bdd is installed."; exit 1; }

  # An example no job runs is an example nobody can trust. Every directory under
  # examples/bdd-adapters/ has one of these, and tests/test_bdd_adapters_all.py asserts it.
  bdd-adapter-behave:
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the BDD runner
        run: pip install -r .github/requirements/behave.txt

      - name: Extract the spec into a runnable feature file
        working-directory: examples/bdd-adapters/behave
        run: python3 ../../../cli/compass bdd extract --issue reset-password --out features/reset-password.feature

      - name: Run the extracted scenarios
        working-directory: examples/bdd-adapters/behave
        run: behave features/

  # An example no job runs is an example nobody can trust. Every directory under
  # examples/bdd-adapters/ has one of these, and tests/test_bdd_adapters_all.py asserts it.
  bdd-adapter-cucumber-js:
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the runner
        working-directory: examples/bdd-adapters/cucumber-js
        run: npm ci --no-audit --no-fund

      - name: Extract the spec into a runnable feature file
        working-directory: examples/bdd-adapters/cucumber-js
        run: python3 ../../../cli/compass bdd extract --issue reset-password --out features/reset-password.feature

      - name: Run the extracted scenarios
        working-directory: examples/bdd-adapters/cucumber-js
        run: npx cucumber-js

  # An example no job runs is an example nobody can trust. Every directory under
  # examples/bdd-adapters/ has one of these, and tests/test_bdd_adapters_all.py asserts it.
  bdd-adapter-godog:
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the runner
        working-directory: examples/bdd-adapters/godog
        run: go mod download

      - name: Extract the spec into a runnable feature file
        working-directory: examples/bdd-adapters/godog
        run: python3 ../../../cli/compass bdd extract --issue reset-password --out features/reset-password.feature

      - name: Run the extracted scenarios
        working-directory: examples/bdd-adapters/godog
        run: go test ./...

  # The Python reference example of four-layer acceptance tests. It runs its
  # specifications through each driver on two workers, then its layering test.
  # tests/acceptance/atdd_strategy/test_reference_example.py asserts this shape.
  atdd-adapter-python:
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install the example's pinned test tools
        run: pip install -r examples/atdd-adapters/python/requirements.txt

      - name: Run the specifications through the API driver
        working-directory: examples/atdd-adapters/python
        run: python3 -m pytest -n 2 --driver api tests/acceptance/test_todos.py

      - name: Run the specifications through the CLI driver
        working-directory: examples/atdd-adapters/python
        run: python3 -m pytest -n 2 --driver cli tests/acceptance/test_todos.py

      - name: Run the layering test
        working-directory: examples/atdd-adapters/python
        run: python3 -m pytest tests/acceptance/test_layering.py

  # The TypeScript reference example, at the Node version its package.json
  # names, with the packages its lock file pins. It runs the example itself,
  # then the Compass tests that need Node: the TypeScript stage 1 red,
  # the TypeScript example and the end-to-end TypeScript issue. The other
  # jobs skip those tests, as a machine without Node does, so
  # COMPASS_REQUIRE_TYPESCRIPT turns a skip into a failure here.
  atdd-adapter-typescript:
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install the example's pinned packages
        working-directory: examples/atdd-adapters/typescript
        run: npm ci --no-audit --no-fund

      - name: Type-check the example
        working-directory: examples/atdd-adapters/typescript
        run: npm run typecheck

      - name: Run the specifications through the API driver
        working-directory: examples/atdd-adapters/typescript
        run: npm run acceptance -- --driver api --workers 2

      - name: Run the specifications through the CLI driver
        working-directory: examples/atdd-adapters/typescript
        run: npm run acceptance -- --driver cli --workers 2

      - name: Run the layering test
        working-directory: examples/atdd-adapters/typescript
        run: npm run layering

      - name: Install the test runner
        run: pip install -r .github/requirements/self-check.txt

      - name: Run the Compass tests that need Node
        env:
          COMPASS_REQUIRE_TYPESCRIPT: '1'
        run: python3 -m pytest -q tests/acceptance/atdd_strategy -k "trc_c5 or trc_j6 or trc_x3"

  check-mutation:
    # Breaks each shipped check, in a copy of the checkout, to always pass and
    # then always fail, and fails when a test in tests/mutation_proofs.yml
    # does not notice. It runs in every merge group rather than on a schedule.
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # The runner took 221 s locally on 2026-10-15; this allows about three times that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the test tooling
        run: pip install -r .github/requirements/self-check.txt

      - name: Break each check and confirm its register tests go red
        run: python3 .github/scripts/check_mutation_runner.py
