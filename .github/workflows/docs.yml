# The documentation site at https://docs.ayeo.io/compass/, built with MkDocs
# Material from the pages mkdocs.yml lists. Every pull request that touches
# them builds the site strictly, so a broken link fails before merge; only a
# push to main publishes. MkDocs is a build tool here, never something
# Compass users install.
name: Docs site

on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the site builder
        run: pip install "mkdocs-material==9.7.1"
      - name: Build the site, failing on any warning
        run: mkdocs build --strict --site-dir site
      - name: Check the theme's stylesheets and scripts were published
        # An exclude pattern once removed them, and the site still built.
        run: |
          ls site/assets/stylesheets/main.*.min.css
          ls site/assets/javascripts/bundle.*.min.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
