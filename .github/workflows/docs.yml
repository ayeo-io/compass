# The documentation site at https://docs.ayeo.io/compass/, built with MkDocs
# Material from the pages mkdocs.yml lists. Every pull request that touches
# them builds the site strictly, so a broken link fails before merge; only a
# push to main publishes. MkDocs is a build tool here, never something
# Compass users install.
#
# `build` is a required check, so it reports on every pull request: a
# workflow filtered out by paths never reports, and the merge would wait for
# it. On a pull request that touches none of the site's files, the job runs
# and skips its own steps, so it ends in success having built nothing.
name: Docs site

on:
  pull_request:           # no paths filter: build reports on every pull request
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One group per ref, so a run on one branch never cancels a run on another,
# and the prefix keeps it apart from other workflows' groups.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the change test diffs against the base
      # Before the change test, which runs Python too.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - id: changed
        name: Did this change touch the site?
        # On a push or a manual run there is no base, and the site is built.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/ci-changed.py --base "$BASE_SHA" --head "$HEAD_SHA"
          --output "$GITHUB_OUTPUT" docs/ mkdocs.yml .github/workflows/docs.yml
      - name: Install the site builder
        if: steps.changed.outputs.run == 'true'
        run: pip install "mkdocs-material==9.7.1"
      - name: Build the site, failing on any warning
        if: steps.changed.outputs.run == 'true'
        run: mkdocs build --strict --site-dir site
      - name: Check the theme's stylesheets and scripts were published
        # An exclude pattern once removed them, and the site still built.
        if: steps.changed.outputs.run == 'true'
        run: |
          ls site/assets/stylesheets/main.*.min.css
          ls site/assets/javascripts/bundle.*.min.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
