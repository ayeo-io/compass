# Compass - reference GitHub Actions workflow.
#
# Copy this to `.github/workflows/compass.yml` in your project. It runs the
# full mechanical gate suite (`compass ci`) on every pull request and on pushes
# to main. The job fails if governance is malformed, a manifest.yml is off-schema,
# or any issue's guardrail checks do not pass.
#
# COMBINED WITH PROJECT CI
#   Compass CI does NOT replace your project CI - it runs *alongside* it as a
#   process-integrity lane. The recommended pattern is two jobs in one
#   workflow: a `project-ci` job for your tests/lint/build/etc., and this
#   `compass-ci` job gated on it (`needs: project-ci`) so a red test suite
#   halts the pipeline before Compass runs. The combined example is in
#   ci/README.md.
#
# Adjust `COMPASS_CLI` to wherever the Compass CLI lives in your repo (a
# vendored copy, a submodule, or a pinned checkout). Pin the Compass copy it
# points at to a specific commit SHA, not a branch - see docs/security.md
# for the supply-chain stance. See ci/README.md for the full integration
# contract.

name: Compass

on:
  pull_request:
  push:
    branches: [main]

# The token these jobs get. Declared rather than inherited: without this block
# the workflow runs with whatever the repository or organisation default is,
# which on many repositories is a read-write token. Compass runs commands a
# project declares in its governance file, so the token handed to that runner
# is part of what a compromised command could reach. Reading the checkout is
# all these jobs need.
permissions:
  contents: read

jobs:
  compass-ci:
    runs-on: ubuntu-latest
    env:
      COMPASS_CLI: cli/compass        # <- path to the Compass CLI in this repo
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Compass mechanical gate suite
        # `compass ci` exits non-zero if governance is invalid, a manifest.yml is
        # off-schema, or any issue's guardrail checks fail. That exit code is
        # the entire integration contract.
        run: python3 "$COMPASS_CLI" ci
