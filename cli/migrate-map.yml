# =============================================================================
# The v1-to-v2 migration map - DATA, deliberately exempt from the
# vocabulary scan (`scan.exempt` in governance/terminology.yml).
#
# Why this file exists: `compass issue migrate` and the read-side normaliser must
# name v1 spellings, inside a CLI whose string literals are scanned for those
# spellings. The mapping lives here as data, so the enforced code never
# carries a banned word in a literal.
# =============================================================================

# Manifest value renames. Read-side: the normaliser maps them on load.
# Write-side: `compass issue migrate` rewrites them on disk.
values:
  # Evidence type and check name. ADR-023 renamed the concept; archived
  # manifests carry the old spelling and must keep clearing their gate.
  evidence_type:
    coherence-check: consistency-check
  check_name:
    coherence-check-passes: consistency-check-passes
  # Friction categories. ADR-023 retired `ceremony`; the enum keeps single
  # tokens, so the pair became over-weight / under-weight.
  friction_category:
    over-ceremony: over-weight
    under-ceremony: under-weight
  follow_up_status:
    owed: outstanding
    paid: resolved
  delivery_approach:
    express: quick-fix
    standard: regular
    expedition: full
    feature: regular
    initiative: full

# Old route names -> the names the display layer prints. Manifests record
# the route names themselves; an old name is read through the map above.
shape_display:
  express: quick fix
  standard: regular
  expedition: full
  feature: regular
  initiative: full
  hotfix: hotfix
  spike: spike

# v1 artifact filenames -> v2, applied inside each issue directory.
# The migration module consumes this section; the copy it keeps in code
# is only the fallback for a tree with no framework install.
artifacts:
  # The issue's own record. `spine` was a metaphor the framework had to teach;
  # `manifest` is what package.json and a Kubernetes manifest already are.
  # Files written as task.yml keep loading - that is what this row is for.
  task.yml: manifest.yml
  brief.md: intent.md
  spec.feature.md: acceptance-criteria.md
  route.md: delivery-approach.md
  clarifications.md: requirements-review.md
  plan.md: technical-design.md      # v1 name, two renames ago
  design.md: technical-design.md    # v2 name, renamed 2026-08-25
  prd.md: intent.md
  spec.feature: acceptance-criteria.feature

# Stage keys: retired stage names mapped to the current ones.
#
# `plan` and `verify` are not listed because they are current keys. `plan` is
# the planning stage's key, skill (`plan-authoring`), agent (`planner`) and
# command, even though v1 used `plan.md` for the design document - see the
# `artifacts:` section above.
stage_keys:
  frame: assess
  specify: define
  clarify: refine
  distribute: breakdown
  build: implement
  land: ship

# Gate ids. `compass check` prints the gate id on every run, so a reader
# learns the vocabulary from it; it is not an internal name - which is why
# ADR-023 renamed it with the concept rather than leaving it. Archived
# manifests carry the old id.
gate_ids:
  verify.fitness: verify.architecture

# Manifest keys renamed by ADR-023, to the words Anthropic's platform docs use.
# The read side applies these through core.SPINE_KEY_MAP; this section is the
# data a reader and the migration tool share.
manifest_keys:
  topology: orchestration
  stream_ceiling: subtask_ceiling

# `.compass/config.yml` block names. This is the one vocabulary file an adopter
# edits by hand, so their existing spelling is read instead of needing to
# change.
config_keys:
  swarm: multiagent
