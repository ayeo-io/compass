id: cmp-feature
prompt: |
  Can you add a longest_track function to src/playlist.py? It should
  take a playlist and return the title of the track with the greatest
  duration. If two tracks are tied for longest, return whichever of
  them was added first. If the playlist is empty, raise a ValueError.
