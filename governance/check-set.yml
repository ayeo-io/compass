# Entries the set holds but does not run. Each is keyed by the compass.yml
# setting that turns it on; `resolved` leaves them out. `agent_review: on`
# adds the advisory judged check of ADR-090 decision 7 at the ship entry.
optional:
  agent_review:
    checks:
      agent-review:
        statement: An agent that did not write the change reviewed it against the acceptance criteria.
        kind: judged
        reviewers: [agent]
        inputs: [acceptance-criteria]
        severity: advisory
        on_skipped: not-applicable
    stages:
      ship:
        entry: [agent-review]
