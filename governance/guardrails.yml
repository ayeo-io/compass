# GENERATED FILE - do not edit by hand. The source is the default preset in
# governance/presets/default/ and governance/legacy-views.yml. Change those,
# then regenerate this file with: python3 scripts/generate-legacy-views.py
# A test fails when this file differs from what that command writes.
# =============================================================================
# A CHECK DERIVES FROM THIS FILE'S STRUCTURE.
# tests/plain_language_check.py builds its registry of what each code means from
# the `gates` of the preset in governance/presets/default/, and from `defaults:`
# and each entry's `id`, `name` and `statement` here when the preset is absent.
# Change those key names or that nesting and the derivation fails loudly,
# naming this file - it does not fall back to a hand-written table, because a
# table would drift from this file in silence. This is the derivation-failure
# criterion (`TRC-C9`).
# =============================================================================
# Compass - guardrails.yml
# =============================================================================
# THE MACHINE-READABLE GUARDRAIL DEFINITIONS. This file is authoritative for
# how guardrails are *checked*. `guardrails.md` explains what each guardrail is
# and why; this file says what evidence clears it, and `compass check` runs
# those checks against an issue's `manifest.yml` and `evidence/`.
#
# Note the asymmetry, and that it is deliberate: GUARDRAILS get a .yml because
# they are checkable and nobody steps off them. A STRATEGY is a strong default
# you can step off with a recorded reason, so `strategies.md` holds it as prose.
# A strategy can carry blocking checks that a recorded step-off makes advisory:
# they sit outside every guardrail below, in no lock, so an approved waiver can
# make them advisory (strategy `S17`). The guardrails keep their own checks.
#
# The five default guardrails below ship active. A project may ADD guardrails
# under `project:` - each needs a named check, or it is a strategy, not a
# guardrail. `compass policy lint` checks this file against
# schemas/guardrails.schema.json.
# =============================================================================

version: 1.41.0
# -----------------------------------------------------------------------------
# Named checks - the mechanical checks `compass check` knows how to run. Each
# guardrail below references one or more of these by name. The check reads
# manifest.yml and evidence/ - it does not re-run tests (that is tdd-green's job);
# it checks the recorded state is coherent and backed by evidence.
# -----------------------------------------------------------------------------
checks:
  landed-by-resolves:
    description: "An issue whose work was delivered through a different issue points at it with `landed_by:`, and the pointer resolves: the named issue exists, has landed, carries a record of its own, and names this one back in `delivered:`. When it holds, four checks about this issue carrying its OWN record stand down - the claim moves rather than being waived. Declines to check when there is no pointer."
  scenarios-have-tests:
    description: "Every scenario in manifest.yml lists at least one test."
  scenarios-are-executable:
    description: "Every scenario in manifest.yml was accounted for by the project's BDD runner. Reads the record `compass bdd verify` writes; never runs the suite. No-ops when project.bdd_runner is unset."
    # Assessment-scoped, exactly like a guardrail's `applies_when:`.
    # Below this threshold a finding is reported without failing the
    # run - most projects have wired no runner, and an advisory
    # finding is the honest default (ADR-006).
    blocking_when: { blast_radius: [cross-cutting, critical] }
  declared-tests-resolve:
    description: "Every declared test id points at a test that exists on disk. Fires only once an issue has claimed the gate verify.correctness and is still active - before that the test legitimately does not exist yet; after landing the manifest is a historical record."
  suite-passed:
    description: >
      A green record on file shows the full suite passing, recently. The
      record is named by its binding - evidence/green-<scenario>.json when
      bound, evidence/green.json when not - and the registry entry names
      whichever was written. When the issue declares scenarios and was
      created on or after 2026-09-24, or has an evidence record dated on or
      after it, a red record (evidence/red.json or
      evidence/red-<scenario>.json, recording a failed run) or an acceptance
      record from `compass acceptance record` must also be on the issue. On
      an issue created on or after 2026-11-03, or with no red, green or
      acceptance record dated before it, each scenario that is not narrative
      also needs a red bound to it, of either loop, dated no later than its
      first green, bound or unbound, unless an acceptance declared before
      that green closes it. A green alone shows the suite passes, not that a
      test failed first.
  changed-code-traces-to-scenario:
    description: "Every changed production file maps to >=1 scenario id."
  scenario-has-id-and-intent:
    description: "Every scenario has a stable id and a linked intent id."
  claim-traces-to-scenario:
    description: >
      Every claim maps to a scenario id that exists. This checks
      traceability, not truth; the reviewer at verify.claims checks whether
      the claim is true.
  gate-evidence-present:
    description: "Every gate marked pass has an evidence pointer that resolves."
  human-approval-present:
    description: "An approval record exists for an irreversible change."
  backfills-paid:
    description: "The issue manifest's follow-ups list is empty or every item is resolved."
  nfr-rows-resolved:
    description: "Every concern row of the spec's Non-functional requirements table (performance, capacity, compatibility, security, privacy, operability, accessibility, and any row added) names scenario ids the manifest holds or a reason the concern does not apply. At thorough depth each cited scenario states a number in its Then. The spec is read at the path the manifest registered, else at docs/compass/<created>-<slug>/acceptance-criteria.md, where its depth is the define stage's mode. Declines to check, rather than passing, for an issue with no generation, a closed issue, an issue created before 2026-11-04 with no spec at either path, an issue whose spec is not written yet, and a registered spec whose catalogue does not list the section at its depth."
  acceptance-applicability-agrees:
    description: "The four-layer acceptance strategy (`S17`) applies to the issue as assess recorded it: the applicability stored at assess agrees with what the red and acceptance records decide, and the project setting has not changed since assess. Advisory: a disagreement names the re-assess command and never fails the run. Declines to check, rather than passing, for an issue assessed before the strategy shipped and for a project that turned the strategy off."
  outer-loop-recorded:
    description: "On an issue the four-layer acceptance strategy (`S17`) applies to, a red record and a green record say loop outer, an outer-loop green was recorded on the tree as it is now, and every registered outer-loop green names its candidate and its client (api, web or cli). A record with no loop field reads as inner. Declines to check, rather than passing, for an issue the strategy does not apply to."
  acceptance-support-present:
    description: "On an issue the four-layer acceptance strategy (`S17`) applies to, the project names each piece of its acceptance support code under `project.acceptance_support` (alias helper, driver factory, DSL root, layering test) and each named path exists inside the project root; no file is read. The first issue the strategy applies to builds the missing pieces as its own work. Claim limit: while a piece is missing, the issue can claim that its scenarios pass, and not that its acceptance tests are isolated from each other (alias helper), run through a driver chosen at start-up (driver factory), keep driver detail out of the specifications (DSL root) or keep the layer rules (layering test). Advisory: a missing piece never fails the run. Declines to check, rather than passing, for an issue the strategy does not apply to and for one with no green on record."
  outer-loop-attempts-recorded:
    description: "On an issue the four-layer acceptance strategy (`S17`) applies to, every registered outer-loop green records `attempts`, a whole number of 1 or more, so `no-trusted-rerun` can tell a rerun from a first pass. An inner-loop green needs none. Declines to check, rather than passing, for an issue the strategy does not apply to and for an issue with no outer-loop green."
  isolation-proven:
    description: "On an issue the four-layer acceptance strategy (`S17`) applies to, on the routing `on` or `existing-dsl-isolation` (a live defect), an `isolation-proof` record written by `compass isolation record` shows the parallel run passed, every test the issue declares ran twice with both runs passing, the record was made on the tree as it is now, and its candidate is the outer-loop green's. A written note does not count. Declines to check, rather than passing, for an issue the strategy does not apply to and on the routing `existing-dsl` (a small, contained change)."
  layering-test-passed:
    description: "On an issue the four-layer acceptance strategy (`S17`) applies to, on the routing `on`, a `layering` record written by `compass layering record` shows the project's own layering test passed on the tree as it is now, and does not show that 0 tests ran. A written note does not count. Declines to check, rather than passing, for an issue the strategy does not apply to and on the routings `existing-dsl` and `existing-dsl-isolation` (a small, contained change and a live defect)."
  spike-conclusion-present:
    description: "A spike has a `spike-conclusion` evidence entry with a recorded decision (discard | graduate-to-delivery | defer); graduate-to-delivery links the next issue."
  spike-no-production-changes:
    description: "A Spike's `changed_files` is empty - a spike ships nothing; graduating to delivery is a fresh assessment, not a merge."
  dod-evidence-typed:
    description: >
      Every item of the issue's Definition of Done (its build exit list) is
      met by a record in the manifest: evidence recorded with `--meets`, a
      person's approval recorded with `compass evidence approve --check`, or
      a follow-up recorded with `compass follow-up add --defers`. An item
      with no record fails. A tick on a page counts for nothing.
      Cross-issue: when another issue has a follow-up with target_task
      pointing at this issue, that follow-up must be resolved before this
      issue ships. On an issue created from 2026-11-04 it is judged once
      every gate has passed; on an older issue it declines to check, rather
      than passing, when no verification report is written yet.
  no-trusted-rerun:
    description: >
      Every test-run evidence entry is checked for rerun integrity. A record
      with rerun_without_change: true must have its test listed in the
      project quarantine registry (governance/quarantine.yml) with a
      tracking issue - a rerun-to-green without a quarantine entry is a `G4`
      failure (`S5`: intermittency is failure). A record with `attempts` > 1
      but no rerun_without_change marker is also rejected - incomplete
      evidence cannot clear `G4`. Old evidence without an `attempts` field
      passes trivially (backward compatibility, ADR-006, `TRC-A5`). May
      carry attempts: <int> and rerun_without_change: <bool> to signal rerun
      integrity (see strategy `S5`).
  evidence-identity-matches:
    description: >
      Every registry entry still names the record it was created from.
      Records are stamped at write time with a `record_id` (unique per
      write) and a `content_digest` (over the payload); the entry stores
      both. A different record_id means the file was replaced after it was
      cited; a matching record_id with a different digest means it was
      edited in place. An entry with no record_id predates stamping and is
      UNVERIFIABLE - reported and counted apart from the passes, never
      treated as checked, because an unstamped record cannot be checked
      against its citation.

  evidence-matches-tree:
    description: >
      The newest test record still names the tree that ships. Every red,
      green and acceptance record carries tree_id, the git tree id of the
      tracked files on disk plus the issue's untracked changed files, less
      .compass/ and docs/compass/, and file_sha256 and file_modes, the
      SHA-256 and the git mode of each changed file and each test file the
      scenarios declare. For an issue in flight the check compares tree_id
      with the tree now, and fails only once every gate has passed; before
      that a stale record is a note. For a landed issue it compares
      file_sha256 and file_modes with the same files in land_commit, the
      commit ship-commit made, read as a checkout writes them, and names
      each file that differs; a record written before file_sha256 is
      compared by its changes_id, a tree of the same files. A record with no
      tree_id, or a landed issue with no land_commit, is not judged; a
      land_commit that is not a commit id fails. It shows which tree a
      record claims, not that a trusted runner made the claim.

  command-passes:
    description: "Runs the project guardrail's declared `command:` via subprocess and checks it exits 0. On success: emits a command-output evidence entry. On failure: emits a command-output evidence entry with exit code + stderr. When verify.architecture is in the gate set and zero project guardrails declare command-passes, it passes without checking anything (no declarations means there are no architecture checks to run)."

# -----------------------------------------------------------------------------
# Evidence types - what KINDS of evidence a gate can be cleared with. Without
# this, `gate-evidence-present` is circular: a gate could be marked `pass`
# pointing at a weak markdown note and still clear the mechanical check. Typing
# the evidence makes the *strength* of a gate's backing visible - and lets the
# checker demand a real mechanical capture for the gates that need one.
#
# Evidence model: manifest.yml has a top-level `evidence:` REGISTRY of typed
# entries (each {id, type, path, ...}); a gate's `evidence:` is a list of
# evidence ids referencing the registry. Multiple gates can share one entry.
# -----------------------------------------------------------------------------
evidence_types:
  test-run:
    description: >
      A recorded test execution - e.g. evidence/green-<scenario>.json from a
      scenario-bound `compass tdd-green`, or evidence/green.json from an
      unbound one. The strongest: a machine ran it. May carry attempts:
      <int> and rerun_without_change: <bool> to signal rerun integrity (see
      strategy `S5` and the no-trusted-rerun check).
  command-output:
    description: "Captured output of a command - a scanner, a linter, a coverage run, a `compass check` run."
  manual-review:
    description: "A recorded reviewer judgement - a code review or governance review captured in a file. Stronger than a generic artifact because it is a named review, not a stray note."
  human-approval:
    description: "A recorded human sign-off - for irreversible changes (guardrail `G5`). Has structured fields: approver, role, decision, timestamp, scope, conditions. Only a record given for guardrail `G5` clears `human-approval-present`: one with no check, waiver, checkpoint, artifact or decisions key, and a guardrail key that is absent or exactly `G5`. A person records one by typing `/compass:approve` in Claude Code, or with `compass evidence approve --guardrail` and the value `G5` at a terminal; an agent under a delegation that covers g5 records one with `--issue <slug> --delegated --as <agent>`."
  artifact-approval:
    description: "A person's approval of one document or of a set of decisions taken for the person. Meets an artifact's human check; never a sign-off for guardrail `G5`."
  approval-withdrawal:
    description: "A person's withdrawal of a guardrail `G5` sign-off made under a delegation, written only by `/compass:reject <record id>`. Names the record in `withdraws`; `human-approval-present` then skips that record while the issue is in flight. It reverses nothing already done."
  checkpoint-approval:
    description: "A person's answer to one checkpoint hand-off, written only by `compass evidence approve --checkpoint`. It never meets guardrail `G5` or a human check."
  isolation-proof:
    description: "A record, written only by `compass isolation record`, of the project's acceptance suite run in parallel once and each scenario's declared tests run twice: the exit codes, the candidate and the client. `compass evidence add` refuses the type, so a written note cannot stand in for one."
  layering:
    description: "A record, written only by `compass layering record`, of one run of the project's own layering test: the command, the test path, the exit code, the number of tests that ran, the tree id and the time. `compass evidence add` refuses the type."
  security-review:
    description: "A recorded security review or scan result - for security-sensitive changes."
  migration-plan:
    description: "A recorded plan for a data, schema, or infrastructure migration."
  rollback-plan:
    description: >
      A record showing the rollback was REHEARSED - what was run, when, and
      against what. Not a plan: SWEBOK v4 §6.3.3 needs "a planned and
      rehearsed rollback" before a new version is deployed, and a rollback
      nobody has run is a guess. A guess recorded as a plan is the assertion
      guardrail `G4` exists to reject.
  claim-review:
    description: "A recorded review of public/user-facing claims against backing scenarios - the marketer's audit trail."
  spike-conclusion:
    description: "A recorded close-out of a spike: what was learned, a decision (discard | graduate-to-delivery | defer), and any link to the next issue."
  consistency-check:
    description: "Output of compass analyze, which 9.0.0 removed (ADR-091). Nothing writes it now; it stays valid so an older manifest that holds one still reads."
  artifact:
    description: "A written record without a more specific type - a review note, a verification report. The weakest, by design: honest for judgement-shaped gates, never enough for a mechanical one."

# gate_evidence_requirements - which evidence types each gate will accept. A
# gate not listed here accepts any type. The point is the constrained ones:
# you cannot clear `verify.correctness` with a markdown note, because
# correctness is a mechanical fact and demands a `test-run`.
gate_evidence_requirements:
  verify.correctness: [test-run]
  verify.regression: [test-run]
  verify.security: [security-review, command-output, test-run]
  verify.governance: [command-output, manual-review, artifact]
  verify.traceability: [command-output, artifact]
  verify.claims: [claim-review, command-output, artifact]
  verify.clarity: [manual-review, artifact]       # inherently judgment - and now visibly so
  spike.conclude: [spike-conclusion]              # SPECIFIC: a generic artifact will not do
  verify.architecture: [test-run, command-output]    # architecture checks: command-output from command-passes, or a test-run

# -----------------------------------------------------------------------------
# DEFAULT GUARDRAILS - `G1`–`G5`. Shipped active. The floor under every delivery approach.
# -----------------------------------------------------------------------------
defaults:

  - id: G1
    name: "Tested before it lands"
    statement: >
      No code reaches main unless it traces to a declared test and a green
      test run is on record. Compass checks that both exist and line up; it
      does not observe the declared test running - see
      docs/safety-contract.md for what a test-run record does and does not
      establish.
    # The red-before-green cycle is strategy `S2`, not this guardrail. `G1` is the
    # outcome; `compass check` checks the outcome, the hook enforces `S2`.
    # `declared-tests-resolve` closes the gap that a test being *named* is not
    # the same as a test existing. It fires only once an issue has claimed
    # verify.correctness and is still active - before that the test legitimately
    # does not exist yet, and after landing the manifest is a historical record.
    checks: [scenarios-have-tests, declared-tests-resolve, suite-passed,
             changed-code-traces-to-scenario, scenarios-are-executable]
    checked_at: [build, ship]

  - id: G2
    name: "Acceptance defined before it is built"
    statement: >
      No code is written that no stated, checkable acceptance criterion
      describes. BDD scenarios (strategy `S1`) are the default form.
    checks: [scenario-has-id-and-intent]
    checked_at: [specify, ship]

  - id: G3
    name: "Traceability holds"
    statement: >
      code -> acceptance criterion -> intent, and public claim -> criterion,
      maintained continuously.
    # `landed-by-resolves` is a traceability check: it is what makes a
    # pointer at another issue's record a LINK rather than a claim. Both
    # ends must name each other, the named issue must have landed, and it
    # must carry a record of its own - otherwise a chain of empty issues
    # could vouch for one another.
    checks: [changed-code-traces-to-scenario, scenario-has-id-and-intent, claim-traces-to-scenario,
             landed-by-resolves]
    checked_at: [specify, build, ship]

  - id: G4
    name: "Evidence, not assertion"
    statement: >
      A guardrail is cleared with artifacts and command output, never a
      claim. The Definition of Done is a typed gate: every item of the
      Definition of Done is met by a record in the manifest (typed evidence,
      a person's approval or a filed follow-up) - a tick on a page or a
      narrative note never clears it.
    checks: [gate-evidence-present, dod-evidence-typed, no-trusted-rerun, command-passes,
             evidence-identity-matches, evidence-matches-tree]
    checked_at: [ship]

  - id: G5
    name: "A human signs off on the irreversible"
    statement: >
      A change labelled auth, payments, personal-data or migrations gets an
      explicit human checkpoint before it lands: it can breach auth, move
      money, expose personal data or lose data that cannot be restored.
    checks: [human-approval-present]
    # Fires on the four labels only. Their change is the one a merge cannot
    # undo: a migration can lose data that cannot be restored, and auth,
    # payments and personal data reach people outside the repository.
    # Critical risk alone does not fire it: critical-risk code that carries
    # none of the labels can be reverted at merge, and CI and review gate
    # it (governance decision 2026-10-12, guardrail-5-triggers-on-the-
    # irreversible-labels). A project that wants critical risk too sets
    # `G5.when` back in compass.yml; the lock allows a stricter trigger.
    applies_when: { touches_any: [auth, payments, personal-data, migrations] }
    checked_at: [ship]

# -----------------------------------------------------------------------------
# SPIKE GUARDRAILS - apply only on a spike. A spike is intentionally
# free of the delivery guardrails (`G1`-`G5` do not apply), but it is still
# CONTROLLED: it must conclude, and it must not silently produce production
# work. `compass check` runs these instead of the defaults on a spike.
# -----------------------------------------------------------------------------
spike_guardrails:

  - id: S1
    name: "Spike conclusion recorded"
    statement: >
      A Spike must record what it learned and a close-out decision: discard
      the work, graduate to delivery, or defer. Without a recorded
      conclusion a Spike is just untracked work.
    checks: [spike-conclusion-present]
    checked_at: [ship]

  - id: S2
    name: "No production change from a Spike"
    statement: >
      A Spike ships nothing - its `changed_files` must be empty. Exploration
      code lives on a scratch branch; if the finding is acted on, a fresh
      assessment owns the code under a real delivery approach's guardrails.
      This is the safety model: a Spike cannot silently become delivery.
    checks: [spike-no-production-changes]
    checked_at: [ship]

# -----------------------------------------------------------------------------
# PROJECT GUARDRAILS - the team adds here. Each MUST reference a named check
# (add new checks to `checks:` above, or ask the CLI maintainer to add the
# check logic). A would-be guardrail with no mechanical check is a strategy -
# put it in strategies.md instead. Leave this empty rather than padding it.
# -----------------------------------------------------------------------------
project: []
# Empty on purpose, not by oversight: the framework ships no project guardrails,
# so an adopting repo sees no project-level check until it declares one.
#  - id: Q1
#    name: "Coverage floor"
#    statement: "Line coverage does not drop below 80%."
#    checks: [coverage-floor]          # <- a project-added check
#    params: { min_line_coverage: 80 }
#    checked_at: [build]
#    # Coverage is a floor, never a target - a high coverage number is a side effect of test discipline, not its goal.

# -----------------------------------------------------------------------------
# Cross-cutting: the conflict rule (a guardrail beats a strategy) and the
# Definition of Done checklist are governance too, but they live where they
# are used - see governance/README.md and the `build` exit list of the shipped
# preset. The four-stage path owes no Definition of Ready (ADR-092).
# -----------------------------------------------------------------------------
