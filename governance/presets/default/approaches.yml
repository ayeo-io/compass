# The shipped default preset: the source of the shipped defaults.
# The two files governance/routing-policy.yml and governance/guardrails.yml
# are generated from these files and governance/legacy-views.yml.
# Change a default here, then run python3 scripts/generate-legacy-views.py.
# Also raise the version in legacy-views.yml, then run the script with --pin
# and again with --pin-hashes, which update the digest and drift fixtures.
# cli/compass_pkg/legacy_adapter.py wrote the first version of these files from
# those two files. The preset is the source now; edit it here.
schema: 1
# 9.0.0 runs every delivery issue on one path of four stages (ADR-092). What a
# delivery issue owes is its evidence_required list, which
# cli/compass_pkg/evidence_required.py computes, so `delivery` declares no gate
# set of its own beyond the three immovable gates. Its stage modes exist only
# because the catalogue needs a mode per stage; no reader judges them. A spike
# keeps its own entry: it is not on the path and its manifest keeps a stage map.
approaches:
  spike:
    weight: 0
    ships: false
    stages: {assess: lightweight, build: explore, ship: graduate-or-discard}
    gates: [spike.conclude]
    subtask_ceiling: 1
    checkpoints:
      controlled: [assess]
      balanced: []
      autonomous: []
    locked: true
  delivery:
    weight: 1
    ships: true
    release_line: true
    stages: {assess: thorough, specify: thorough, build: thorough, ship: thorough}
    gates: [verify.correctness, verify.governance, verify.traceability]
    subtask_ceiling: 1
    acceptance_strategy: 'on'
    checkpoints:
      controlled: [assess, specify]
      balanced: []
      autonomous: []
