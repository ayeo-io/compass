# The shipped default preset: the source of the shipped defaults.
# The two files governance/routing-policy.yml and governance/guardrails.yml
# are generated from these files and governance/legacy-views.yml.
# Change a default here, then run python3 scripts/generate-legacy-views.py.
# Also raise the version in legacy-views.yml, then run the script with --pin
# and again with --pin-hashes, which update the digest and drift fixtures.
# cli/compass_pkg/legacy_adapter.py wrote the first version of these files from
# those two files. The preset is the source now; edit it here.
schema: 1
checks:
  landed-by-resolves: {statement: 'An issue whose work was delivered through a different issue points
      at it with `landed_by:`, and the pointer resolves: the named issue exists, has landed, carries a
      record of its own, and names this one back in `delivered:`. When it holds, four checks about this
      issue carrying its OWN record stand down - the claim moves rather than being waived. Declines to
      check when there is no pointer.', kind: deterministic, impl: landed-by-resolves, severity: blocking,
    on_skipped: not-applicable, locked: true}
  scenarios-have-tests: {statement: Every scenario in manifest.yml lists at least one test., kind: deterministic,
    impl: scenarios-have-tests, severity: blocking, on_skipped: fail, locked: true}
  scenarios-are-executable:
    statement: Every scenario in manifest.yml was accounted for by the project's BDD runner. Reads the
      record `compass bdd verify` writes; never runs the suite. No-ops when project.bdd_runner is unset.
    kind: deterministic
    impl: scenarios-are-executable
    severity: blocking
    blocking_when:
      risk: [cross-cutting, critical]
    on_skipped: not-applicable
    locked: true
  declared-tests-resolve: {statement: Every declared test id points at a test that exists on disk. Fires
      only once an issue has claimed the gate verify.correctness and is still active - before that the test legitimately
      does not exist yet; after landing the manifest is a historical record., kind: deterministic, impl: declared-tests-resolve,
    severity: blocking, on_skipped: pass, locked: true}
  suite-passed: {statement: 'A green record on file shows the full suite passing, recently. The record
      is named by its binding - evidence/green-<scenario>.json when bound, evidence/green.json when not
      - and the registry entry names whichever was written. When the issue declares scenarios and was
      created on or after 2026-09-24, or has an evidence record dated on or after it, a red record (evidence/red.json
      or evidence/red-<scenario>.json, recording a failed run) or an acceptance record from `compass acceptance
      record` must also be on the issue. On an issue created on or after 2026-11-03, or with no red, green
      or acceptance record dated before it, each scenario that is not narrative also needs a red bound
      to it, of either loop, dated no later than its first green, bound or unbound, unless an acceptance
      declared before that green closes it. A green alone shows the suite passes, not that a test failed first.

      ', kind: deterministic, impl: suite-passed, severity: blocking, on_skipped: fail, locked: true}
  changed-code-traces-to-scenario: {statement: Every changed production file maps to >=1 scenario id.,
    kind: deterministic, impl: changed-code-traces-to-scenario, severity: blocking, on_skipped: fail,
    locked: true}
  scenario-has-id-and-intent: {statement: Every scenario has a stable id and a linked intent id., kind: deterministic,
    impl: scenario-has-id-and-intent, severity: blocking, on_skipped: fail, locked: true}
  claim-traces-to-scenario: {statement: 'Every claim maps to a scenario id that exists. This checks traceability,
      not truth; the reviewer at verify.claims checks whether the claim is true.

      ', kind: deterministic, impl: claim-traces-to-scenario, severity: blocking, on_skipped: not-applicable,
    locked: true}
  gate-evidence-present: {statement: Every gate marked pass has an evidence pointer that resolves., kind: deterministic,
    impl: gate-evidence-present, severity: blocking, on_skipped: fail, locked: true}
  human-approval-present: {statement: An approval record exists for an irreversible change., kind: deterministic,
    impl: human-approval-present, severity: blocking, on_skipped: fail, locked: hard}
  backfills-paid: {statement: 'On an issue assessed before 9.0.0, the manifest''s follow-ups list is
      empty or every item is resolved. A path issue has nothing to check: each of its follow-ups links
      to a GitHub issue, which tracks the work.', kind: deterministic, impl: backfills-paid, severity: blocking,
    on_skipped: fail}
  nfr-rows-resolved: {statement: 'Every concern row of the spec''s Non-functional requirements table
      (performance, capacity, compatibility, security, privacy, operability, accessibility, and any row
      added) names scenario ids the manifest holds or a reason the concern does not apply. At thorough
      depth each cited scenario states a number in its Then. The spec is read at the path the manifest
      registered, else at docs/compass/<created>-<slug>/acceptance-criteria.md, where its depth is the
      define stage''s mode. Declines to check, rather than passing, for an issue with no generation, a
      closed issue, an issue created before 2026-11-04 with no spec at either path, an issue whose spec
      is not written yet, and a registered spec whose catalogue does not list the section at its depth.',
    kind: deterministic,
    impl: nfr-rows-resolved, severity: blocking, on_skipped: not-applicable}
  acceptance-applicability-agrees: {statement: 'The four-layer acceptance strategy (`S17`) applies to
      the issue as assess recorded it: the applicability stored at assess agrees with
      what the red and acceptance records decide, and the project setting has not changed since assess.
      Advisory: a disagreement names the re-assess command and never fails the run. Declines to check,
      rather than passing, for an issue assessed before the strategy shipped and for a project that
      turned the strategy off.', kind: deterministic, impl: acceptance-applicability-agrees, severity: advisory,
    on_skipped: not-applicable}
  outer-loop-recorded: {statement: 'On an issue the four-layer acceptance strategy (`S17`) applies to, a red record and a green record say loop outer, an outer-loop green was recorded on the tree as it is now, and every registered outer-loop green names its candidate and its client (api, web or cli). A record with no loop field reads as inner. Declines to check, rather than passing, for an issue the strategy does not apply to.', kind: deterministic, impl: outer-loop-recorded, severity: blocking,
    on_skipped: not-applicable}
  acceptance-support-present: {statement: 'On an issue the four-layer acceptance strategy (`S17`) applies
      to, the project names each piece of its acceptance support code under `project.acceptance_support`
      (alias helper, driver factory, DSL root, layering test) and each named path exists inside the project
      root; no file is read. The first issue the strategy applies to builds the missing pieces as its own
      work. Claim limit: while a piece is missing, the issue can claim that its scenarios pass, and not
      that its acceptance tests are isolated from each other (alias helper), run through a driver chosen
      at start-up (driver factory), keep driver detail out of the specifications (DSL root) or keep the
      layer rules (layering test). Advisory: a missing piece never fails the run. Declines to check, rather
      than passing, for an issue the strategy does not apply to and for one with no green on record.', kind: deterministic, impl: acceptance-support-present,
    severity: advisory, on_skipped: not-applicable}
  outer-loop-attempts-recorded: {statement: 'On an issue the four-layer acceptance strategy (`S17`) applies to, every registered outer-loop green records `attempts`, a whole number of 1 or more, so `no-trusted-rerun` can tell a rerun from a first pass. An inner-loop green needs none. Declines to check, rather than passing, for an issue the strategy does not apply to and for an issue with no outer-loop green.', kind: deterministic, impl: outer-loop-attempts-recorded,
    severity: blocking, on_skipped: not-applicable}
  isolation-proven: {statement: 'On an issue the four-layer acceptance strategy (`S17`) applies to, on the routing `on` or `existing-dsl-isolation` (a live defect), an `isolation-proof` record written by `compass isolation record` shows the parallel run passed, every test the issue declares ran twice with both runs passing, the record was made on the tree as it is now, and its candidate is the outer-loop green''s. A written note does not count. Declines to check, rather than passing, for an issue the strategy does not apply to and on the routing `existing-dsl` (a small, contained change).', kind: deterministic, impl: isolation-proven,
    severity: blocking, on_skipped: not-applicable}
  layering-test-passed: {statement: 'On an issue the four-layer acceptance strategy (`S17`) applies to, on the routing `on`, a `layering` record written by `compass layering record` shows the project''s own layering test passed on the tree as it is now, and does not show that 0 tests ran. A written note does not count. Declines to check, rather than passing, for an issue the strategy does not apply to and on the routings `existing-dsl` and `existing-dsl-isolation` (a small, contained change and a live defect).', kind: deterministic, impl: layering-test-passed,
    severity: blocking, on_skipped: not-applicable}
  spike-conclusion-present: {statement: A spike has a `spike-conclusion` evidence entry with a recorded
      decision (discard | graduate-to-delivery | defer); graduate-to-delivery links the next issue., kind: deterministic,
    impl: spike-conclusion-present, severity: blocking, on_skipped: fail, locked: true}
  spike-no-production-changes: {statement: 'A Spike''s `changed_files` is empty - a spike ships nothing;
      graduating to delivery is a fresh assessment, not a merge.', kind: deterministic, impl: spike-no-production-changes,
    severity: blocking, on_skipped: fail, locked: true}
  dod-evidence-typed: {statement: 'Every item of the issue''s Definition of Done (its build exit list)
      is met by a record in the manifest: evidence recorded with `--meets`, a person''s approval
      recorded with `compass evidence approve --check`, or a follow-up recorded with `compass follow-up
      add --defers`. On a path issue a follow-up meets the item only when it links to a GitHub issue
      (`--github owner/repo#N`), and need not be resolved. An item with no record fails. A tick on a
      page counts for nothing. Cross-issue: when an issue assessed before 9.0.0 has a follow-up with
      target_task pointing at this issue, that follow-up must be resolved before this issue ships. On an issue created from 2026-11-04
      it is judged once every gate has passed; on an older issue it declines to check, rather
      than passing, when no verification report is written yet.

      ', kind: deterministic, impl: dod-evidence-typed, severity: blocking, on_skipped: not-applicable,
    locked: true}
  no-trusted-rerun: {statement: 'Every test-run evidence entry is checked for rerun integrity. A record
      with rerun_without_change: true must have its test listed in the project quarantine registry (governance/quarantine.yml)
      with a tracking issue - a rerun-to-green without a quarantine entry is a `G4` failure (`S5`: intermittency
      is failure). A record with `attempts` > 1 but no rerun_without_change marker is also rejected -
      incomplete evidence cannot clear `G4`. Old evidence without an `attempts` field passes trivially
      (backward compatibility, ADR-006, `TRC-A5`). May carry attempts: <int> and rerun_without_change:
      <bool> to signal rerun integrity (see strategy `S5`).

      ', kind: deterministic, impl: no-trusted-rerun, severity: blocking, on_skipped: fail, locked: true}
  evidence-identity-matches: {statement: 'Every registry entry still names the record it was created from.
      Records are stamped at write time with a `record_id` (unique per write) and a `content_digest` (over
      the payload); the entry stores both. A different record_id means the file was replaced after it
      was cited; a matching record_id with a different digest means it was edited in place. An entry with
      no record_id predates stamping and is UNVERIFIABLE - reported and counted apart from the passes,
      never treated as checked, because an unstamped record cannot be checked against its citation.

      ', kind: deterministic, impl: evidence-identity-matches, severity: blocking, on_skipped: not-applicable,
    locked: true}
  evidence-matches-tree: {statement: 'The newest test record still names the tree that ships. Every
      red, green and acceptance record carries tree_id, the git tree id of the tracked files on disk
      plus the issue''s untracked changed files, less .compass/ and docs/compass/, and file_sha256
      and file_modes, the SHA-256 and the git mode of each changed file and each test file the
      scenarios declare. For an issue in flight the check compares tree_id with the tree now, and
      fails only once every gate has passed; before that a stale record is a note. For a landed
      issue it compares file_sha256 and file_modes with the same files in land_commit, the commit
      ship-commit made, read as a checkout writes them, and names each file that differs; a record
      written before file_sha256 is compared by its changes_id, a tree of the same files. A record
      with no tree_id, or a landed issue with no land_commit, is not judged; a land_commit that is
      not a commit id fails. It shows which tree a record claims, not that a trusted runner made the
      claim.

      ', kind: deterministic, impl: evidence-matches-tree, severity: blocking, on_skipped: not-applicable,
    locked: true}
  command-passes: {statement: 'Runs the project guardrail''s declared `command:` via subprocess and checks
      it exits 0. On success: emits a command-output evidence entry. On failure: emits a command-output
      evidence entry with exit code + stderr. When verify.architecture is in the gate set and zero project
      guardrails declare command-passes, it passes without checking anything (no declarations means there
      are no architecture checks to run).', kind: deterministic, impl: command-passes, severity: blocking,
    on_skipped: not-applicable, locked: true}
  dod-every-scenario-passes: {statement: 'Every scenario passes - each scenario has a passing test on record; the spec, read as the acceptance suite, is green.',
      kind: human, severity: blocking, on_skipped: fail, requires: [entry-exit-evaluation], when: {ships: true}}
  dod-suite-green: {statement: 'TDD suite green - the record of the full suite passing is on file (`compass tdd-green`).', kind: human, severity: blocking,
      on_skipped: fail, requires: [entry-exit-evaluation], when: {ships: true}}
  dod-coverage-floor: {statement: 'Coverage meets the "Tested before it lands" guardrail''s floor (`G1`), with its evidence on record.', kind: human,
      severity: blocking, on_skipped: fail, requires: [entry-exit-evaluation], when: {ships: true}}
  dod-no-lint-errors: {statement: 'No lint / format / type errors - clean, with the record linked.', kind: human, severity: blocking,
      on_skipped: fail, requires: [entry-exit-evaluation], when: {ships: true}}
  dod-traceability-intact: {statement: Traceability intact - code → scenario → intent holds; claim → scenario holds where the marketer
        is in play., kind: human, severity: blocking, on_skipped: fail, requires: [entry-exit-evaluation], when: {ships: true}}
  dod-living-docs-updated: {statement: (carried to ship) Living docs updated to match reality., kind: human, severity: blocking,
      on_skipped: fail, requires: [entry-exit-evaluation], when: {ships: true}}
  dod-follow-ups-settled: {statement: '(carried to ship) Every follow-up is settled or links to the GitHub issue that
        tracks it - no unsettled, unlinked hotfix follow-up, no unbacked marketing claim.', kind: human, severity: blocking, on_skipped: fail, requires: [entry-exit-evaluation], when: {ships: true}}
