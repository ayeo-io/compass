# The shipped default preset: the source of the shipped defaults.
# The two files governance/routing-policy.yml and governance/guardrails.yml
# are generated from these files and governance/legacy-views.yml.
# Change a default here, then run python3 scripts/generate-legacy-views.py.
# Also raise the version in legacy-views.yml, then run the script with --pin
# and again with --pin-hashes, which update the digest and drift fixtures.
# cli/compass_pkg/legacy_adapter.py wrote the first version of these files from
# those two files. The preset is the source now; edit it here.
schema: 1
gates:
  G1:
    kind: guardrail
    name: Tested before it lands
    statement: 'No code reaches main unless it traces to a declared test and a green test run is on record.
      Compass checks that both exist and line up; it does not observe the declared test running - see
      docs/safety-contract.md for what a test-run record does and does not establish.

      '
    stage: verify
    applies_to: {ships: true}
    checks: [scenarios-have-tests, declared-tests-resolve, suite-passed, changed-code-traces-to-scenario,
      scenarios-are-executable]
    locked: true
  G2:
    kind: guardrail
    name: Acceptance defined before it is built
    statement: 'No code is written that no stated, checkable acceptance criterion describes. BDD scenarios
      (strategy `S1`) are the default form.

      '
    stage: refine
    applies_to: {ships: true}
    checks: [scenario-has-id-and-intent]
    locked: true
  G3:
    kind: guardrail
    name: Traceability holds
    statement: 'code -> acceptance criterion -> intent, and public claim -> criterion, maintained continuously.

      '
    stage: refine
    applies_to: {ships: true}
    checks: [changed-code-traces-to-scenario, scenario-has-id-and-intent, claim-traces-to-scenario, landed-by-resolves]
    locked: true
  G4:
    kind: guardrail
    name: Evidence, not assertion
    statement: 'A guardrail is cleared with artifacts and command output, never a claim. The Definition
      of Done is a typed gate: every unchecked DoD box must reference typed evidence or a filed follow-up
      - narrative notes never clear it.

      '
    stage: verify
    applies_to: {ships: true}
    checks: [gate-evidence-present, dod-evidence-typed, consistency-check-passes, no-trusted-rerun, command-passes,
      evidence-identity-matches, evidence-matches-tree, dashboard-current, borrowed-documents-answered,
      multiagent-run-recorded]
    locked: true
  G5:
    kind: guardrail
    name: A human signs off on the irreversible
    statement: 'A change that can lose data, move money, or breach auth or privacy gets an explicit human
      checkpoint before it lands.

      '
    stage: ship
    applies_to: {ships: true}
    when:
      any_of:
      - labels_any: [auth, payments, personal-data, migrations]
      - {risk: critical}
    checks: [human-approval-present]
    locked: hard
  S1:
    kind: guardrail
    name: Spike conclusion recorded
    statement: 'A Spike must record what it learned and a close-out decision: discard the work, graduate
      to delivery, or defer. Without a recorded conclusion a Spike is just untracked work.

      '
    stage: ship
    applies_to: {ships: false}
    checks: [spike-conclusion-present]
    locked: true
  S2:
    kind: guardrail
    name: No production change from a Spike
    statement: 'A Spike ships nothing - its `changed_files` must be empty. Exploration code lives on a
      scratch branch; if the finding is acted on, a fresh assessment owns the code under a real delivery
      approach''s guardrails. This is the safety model: a Spike cannot silently become delivery.

      '
    stage: ship
    applies_to: {ships: false}
    checks: [spike-no-production-changes]
    locked: true
  verify.correctness:
    kind: review
    stage: verify
    accepts: [test-run]
    locked: true
  verify.regression:
    kind: review
    stage: verify
    accepts: [test-run]
  verify.security:
    kind: review
    stage: verify
    accepts: [security-review, command-output, test-run]
  verify.governance:
    kind: review
    stage: verify
    accepts: [command-output, manual-review, artifact]
    locked: true
  verify.traceability:
    kind: review
    stage: verify
    accepts: [command-output, artifact]
    locked: true
  verify.claims:
    kind: review
    stage: verify
    accepts: [claim-review, command-output, artifact]
  verify.clarity:
    kind: review
    stage: verify
    accepts: [manual-review, artifact]
  spike.conclude:
    kind: review
    stage: verify
    accepts: [spike-conclusion]
    locked: true
  verify.analyze:
    kind: review
    stage: verify
    accepts: [consistency-check]
  verify.architecture:
    kind: review
    stage: verify
    accepts: [test-run, command-output]
