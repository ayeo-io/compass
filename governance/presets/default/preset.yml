# The shipped default preset: the source of the shipped defaults.
# The two files governance/routing-policy.yml and governance/guardrails.yml
# are generated from these files and governance/legacy-views.yml.
# Change a default here, then run python3 scripts/generate-legacy-views.py.
# Also raise the version in legacy-views.yml, then run the script with --pin
# and again with --pin-hashes, which update the digest and drift fixtures.
# cli/compass_pkg/legacy_adapter.py wrote the first version of these files from
# those two files. The preset is the source now; edit it here.
schema: 1
id: default
version: 6.0.0
capabilities: {entry-exit-evaluation: false, artifact-freshness: false}
locks:
  hard: [checks.human-approval-present, gates.G5]
  locked: [stages.assess, stages.verify, stages.ship, approaches.spike, rules.immovable_gates, checks.borrowed-documents-answered,
    checks.dashboard-current, checks.landed-by-resolves, checks.scenarios-have-tests, checks.scenarios-are-executable,
    checks.declared-tests-resolve, checks.suite-passed, checks.changed-code-traces-to-scenario, checks.scenario-has-id-and-intent,
    checks.claim-traces-to-scenario, checks.gate-evidence-present, checks.spike-conclusion-present, checks.spike-no-production-changes,
    checks.dod-evidence-typed, checks.consistency-check-passes, checks.no-trusted-rerun, checks.evidence-identity-matches,
    checks.evidence-matches-tree, checks.command-passes, checks.multiagent-run-recorded, gates.G1, gates.G2,
    gates.G3, gates.G4, gates.S1, gates.S2, gates.verify.correctness, gates.verify.governance, gates.verify.traceability,
    gates.spike.conclude]
