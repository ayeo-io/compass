# The shipped default preset: the source of the shipped defaults.
# The two files governance/routing-policy.yml and governance/guardrails.yml
# are generated from these files and governance/legacy-views.yml.
# Change a default here, then run python3 scripts/generate-legacy-views.py.
# Also raise the version in legacy-views.yml, then run the script with --pin
# and again with --pin-hashes, which update the digest and drift fixtures.
# cli/compass_pkg/legacy_adapter.py wrote the first version of these files from
# those two files. The preset is the source now; edit it here.
schema: 1
rules:
  default_shapes:
    kind: shapes
    hit: {lean_toward: first}
    rules:
      RP-SHAPE-001:
        order: 1
        when: {goal: exploration}
        then: {lean_toward: spike}
        rationale: Exploration intent - cannot frame for delivery yet.
      RP-SHAPE-FALLBACK:
        order: 2
        when: {}
        then: {lean_toward: delivery}
        rationale: No other shape matched, so the working default.
  floors:
    kind: floors
    hit: {require_skill: collect, add_gate: collect}
    rules:
      RP-FLOOR-002:
        order: 1
        when:
          familiarity: brownfield-unmapped
          any_of:
          - size: [medium, large, product]
          - risk: [cross-cutting, critical]
          - labels_any: [auth, payments, personal-data, migrations]
        then: {require_skill: behavior-mapping}
        rationale: You cannot safely change behaviour you have not first written down.
      RP-REQUIRE-003:
        order: 2
        when:
          risk: [cross-cutting, critical]
        then: {add_gate: verify.architecture}
        rationale: Architecture checked before cross-cutting or critical changes land.
      RP-REQUIRE-004:
        order: 3
        when:
          labels_any: [auth, payments, personal-data, migrations]
        then: {add_gate: verify.architecture}
        rationale: Irreversible-surface issues have architecture checked before they ship.
  loop_ceilings:
    kind: ceilings
    hit: {limit: min}
    rules:
      RP-LOOP-001:
        order: 1
        then: {ceiling: builder_attempts, limit: 3}
        rationale: A builder that has failed three times needs a new brief or a stop, not a fourth try.
      RP-LOOP-002:
        order: 2
        then: {ceiling: review_rounds, limit: 3}
        rationale: Review rounds past three mean the brief or the plan is wrong; record why before landing.
      RP-LOOP-003:
        order: 3
        when:
          risk: [trivial, contained]
        then: {ceiling: review_rounds, limit: 2}
        rationale: A contained change that has not passed in two rounds needs a recorded reason.
      RP-LOOP-004:
        order: 4
        then: {ceiling: replans, limit: 2}
        rationale: A breakdown replanned twice is not converging; stop and ask.
      RP-LOOP-005:
        order: 5
        then: {ceiling: repeated_error, limit: 3}
        rationale: The same error three times is a failure, not a reason for a fourth attempt.
      RP-LOOP-006:
        order: 6
        then: {ceiling: run_cycles, limit: 30}
        rationale: One long unattended run loses the thread; a run that has not finished in 30 sessions
          needs a person.
      RP-LOOP-007:
        order: 7
        then: {ceiling: run_minutes, limit: 240}
        rationale: An unattended run that is still going after four hours is not converging, and is spending
          money.
      RP-LOOP-008:
        order: 8
        then: {ceiling: run_cost_usd, limit: 5}
        rationale: Every session of an unattended run is paid; five US dollars is the most one run may
          spend, set by the maintainer on 2026-10-03.
  immovable_gates:
    kind: immovable-gates
    hit: {gate: collect}
    rules:
      RP-GATE-001:
        order: 1
        then: {gate: verify.correctness}
        rationale: Protects the user - the work must satisfy its acceptance criteria.
      RP-GATE-002:
        order: 2
        then: {gate: verify.governance}
        rationale: Protects the project's own rules - honours guardrails and strategies.
      RP-GATE-003:
        order: 3
        then: {gate: verify.traceability}
        rationale: Protects the audit trail - code -> criterion -> intent stays intact.
    locked: true
  advisory:
    kind: advisory
    hit: {strategy: collect}
    rules:
      RP-ADV-001:
        order: 1
        when:
          risk: [cross-cutting, critical]
        then: {strategy: regression-baseline}
        rationale: 'Shared/critical surface - capture a green baseline of the designated existing suite
          (project.regression_baseline_suite, else test_command) BEFORE the change and re-run it AFTER;
          record both as test-run evidence on verify.regression. Soft: assessed as reviewer judgement,
          never gating - it is the regression-baseline strategy, and a strategy is assessed rather than
          checked.'
      RP-ADV-002:
        order: 2
        when:
          familiarity: brownfield-unmapped
          size: [atomic, small]
          risk: [trivial, contained]
        then: {strategy: behavior-mapping}
        rationale: 'Unmapped ground on a small change - before editing, write a test that pins what the
          code does now where the change touches it, so the change cannot break behaviour nobody wrote
          down. Advice, not a floor: a larger, riskier or domain-labelled unmapped change meets RP-FLOOR-002.'
  biases:
    kind: biases
    hit: {}
    rules:
      RP-BIAS-001: {order: 1, rationale: 'When size is genuinely unclear, estimate up - it is cheaper
          to collapse a stage that turned out easy than to discover mid-implementation that the approach
          was too light.'}
      RP-BIAS-002: {order: 2, rationale: Prefer the lightest delivery approach that still clears every
          routing guardrail and the applicable gates. Process weight is a cost; spend it where it buys
          safety.}
