# The shipped default preset: the source of the shipped defaults.
# The two files governance/routing-policy.yml and governance/guardrails.yml
# are generated from these files and governance/legacy-views.yml.
# Change a default here, then run python3 scripts/generate-legacy-views.py.
# Also raise the version in legacy-views.yml, then run the script with --pin
# and again with --pin-hashes, which update the digest and drift fixtures.
# cli/compass_pkg/legacy_adapter.py wrote these files once, from those two files.
schema: 1
stages:
  assess:
    order: 1
    modes:
      light: {rank: 2}
      full: {rank: 3}
    locked: true
  define:
    order: 2
    modes:
      collapsed: {rank: 1}
      light: {rank: 2}
      full: {rank: 3}
      reproduce-first: {}
  refine:
    order: 3
    modes:
      skipped: {rank: 0}
      collapsed: {rank: 1}
      light: {rank: 2}
      full: {rank: 3}
  plan:
    order: 4
    modes:
      collapsed: {rank: 1}
      full: {rank: 3}
  breakdown:
    order: 5
    modes:
      skipped: {rank: 0}
      multiagent: {}
  implement:
    order: 6
    modes:
      full: {rank: 3}
      expedited: {}
      explore: {}
  verify:
    order: 7
    modes:
      light: {rank: 2}
      full: {rank: 3}
      conclude: {}
    locked: true
  ship:
    order: 8
    modes:
      light: {rank: 2}
      full: {rank: 3}
      full-plus-backfill: {rank: 4}  # vocabulary-scan: allow - machine enum value that manifests on disk already carry
      graduate-or-discard: {}
    locked: true
