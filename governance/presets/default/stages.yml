# The shipped default preset, produced once from governance/routing-policy.yml
# and governance/guardrails.yml by cli/compass_pkg/legacy_adapter.py.
# From the increment that turns those two legacy files into generated views,
# these files are the source of the shipped defaults. Change the defaults
# here, never in a view.
schema: 1
stages:
  assess:
    order: 1
    modes:
      light: {rank: 2}
      full: {rank: 3}
    locked: true
  define:
    order: 2
    modes:
      collapsed: {rank: 1}
      light: {rank: 2}
      full: {rank: 3}
      reproduce-first: {}
  refine:
    order: 3
    modes:
      skipped: {rank: 0}
      collapsed: {rank: 1}
      light: {rank: 2}
      full: {rank: 3}
  plan:
    order: 4
    modes:
      collapsed: {rank: 1}
      full: {rank: 3}
  breakdown:
    order: 5
    modes:
      skipped: {rank: 0}
      multiagent: {}
  implement:
    order: 6
    modes:
      full: {rank: 3}
      expedited: {}
      explore: {}
  verify:
    order: 7
    modes:
      light: {rank: 2}
      full: {rank: 3}
      conclude: {}
    locked: true
  ship:
    order: 8
    modes:
      light: {rank: 2}
      full: {rank: 3}
      full-plus-backfill: {rank: 4}  # vocabulary-scan: allow - machine enum value that manifests on disk already carry
      graduate-or-discard: {}
    locked: true
