# =============================================================================
# Compass - routing-policy.yml
# =============================================================================
# THE MACHINE-READABLE ROUTING POLICY. This file is authoritative for the
# mechanical parts of routing. `routing-policy.md` explains the why; this file
# is what the deterministic evaluator (`compass approach evaluate`) actually runs.
#
# The split that matters: the four-dimension *assessment* (risk, familiarity,
# size, goal, role, labels) is JUDGEMENT - the assess stage, an LLM or a
# human, produces it, and it is not mechanisable, because that judgement
# IS the adaptivity. This file governs only what happens *after* the assessment
# is recorded: composing and constraining the delivery approach. That part is deterministic and
# reproducible - same assessment + same policy => same delivery approach, every time.
#
# Edit this file to tune routing. `compass policy lint` checks it against
# schemas/routing-policy.schema.json. Loosening a routing rule weakens the
# framework for everyone - see routing-policy.md.
# =============================================================================

version: 2.15.0
# -----------------------------------------------------------------------------
# ROUTING STRATEGIES - soft. They BIAS the candidate delivery approach. The evaluator uses
# them in composition (step 1); a later rule can override the result.
# -----------------------------------------------------------------------------
routing_strategies:

  # default_shapes - the reference approach the evaluator leans towards for an assessment.
  # Evaluated top to bottom; the first whose `when` matches sets the candidate.
  # `when` keys match against the assessment; a list value means "any of".
  default_shapes:
    - id: RP-SHAPE-001
      when: { goal: exploration }
      lean_toward: spike
      rationale: "Exploration intent - cannot frame for delivery yet."
    - id: RP-SHAPE-002
      when: { urgency: live-defect, size: [atomic, small] }
      lean_toward: hotfix
      rationale: "A live defect, small enough to reproduce-and-fix fast."
    - id: RP-SHAPE-003
      when: { size: [atomic, small], risk: [trivial, contained], familiarity: [greenfield, brownfield-mapped] }
      lean_toward: express
      # New code has no existing behaviour to break, so greenfield qualifies;
      # unmapped code does, so brownfield-unmapped stays out.
      rationale: "Small on every axis, on new or already-mapped ground."
    - id: RP-SHAPE-004
      when: { size: [large, product] }
      lean_toward: expedition
      rationale: "Large work - full weight, plausibly parallel."
    - id: RP-SHAPE-005
      when: { size: standard }
      lean_toward: standard
      rationale: "The default working shape."

  # Fallback when no default_shape matches.
  default_route: standard

  # biases - free-text tie-breakers the assess stage applies during composition.
  # Not machine-evaluated; surfaced to the assess stage and recorded for audit.
  biases:
    - "When size is genuinely unclear, estimate up - it is cheaper to
       collapse a stage that turned out easy than to discover mid-implementation
       that the approach was too light."
    - "A non-engineering role in play usually pulls the delivery approach
       heavier, because it adds artifacts and assessed strategies - but this is
       a bias, not a floor."
    - "Prefer the lightest delivery approach that still clears every routing
       guardrail and the applicable gates. Process weight is a cost; spend
       it where it buys safety."

  # role_defaults - advisory artifacts a role's involvement suggests. The
  # BLOCKING versions live under routing_guardrails.role_rules.
  role_defaults:
    - id: RP-SROLE-001
      when: { role: designer }
      suggest_artifact: ui-contract.md
      rationale: "A new user-facing surface usually wants a UI contract."

  # advisory_strategies - soft strategies the evaluator surfaces (in
  # `applicable_strategies`) when their `when` matches the assessment. They BIAS
  # and are ASSESSED at `verify`; they NEVER add a gate, raise the delivery approach, or block
  # `ship`. A strategy, not a guardrail (the full method strategy is `S6` in
  # governance/strategies.md).
  advisory_strategies:
    - id: RP-ADV-001
      strategy: regression-baseline
      when: { risk: [cross-cutting, critical] }
      rationale: "Shared/critical surface - capture a green baseline of the
        designated existing suite (project.regression_baseline_suite, else
        test_command) BEFORE the change and re-run it AFTER; record both as
        test-run evidence on verify.regression. Soft: assessed as reviewer
        judgement, never gating - it is the regression-baseline strategy, and a
        strategy is assessed rather than checked."

# -----------------------------------------------------------------------------
# ROUTING RULES - hard. They BOUND the candidate delivery approach. The evaluator
# applies these after composition; they cannot be bypassed, and a human
# cannot override them per-issue (changing one means editing this file).
# -----------------------------------------------------------------------------
routing_guardrails:

  # floors - a matching assessment value forces the delivery approach to be AT LEAST a given weight,
  # and/or forces specific stages/skills back to full weight.
  # Route weight order for force_minimum_route: spike < express < standard
  # < hotfix < expedition. The evaluator raises the candidate to the max.
  # NOTE: six of the entries below carry RP-REQUIRE ids because they attach a
  # gate and raise no minimum - they are not floors. The block name lags its
  # contents: moving them into their own section changes a
  # structure the evaluator iterates and the schema checks, which is filed
  # as rename-routing-policy-machine-keys. See ADR-016.
  floors:
    - id: RP-FLOOR-001
      when: { risk: critical }
      force_minimum_route: expedition
      never_skip: [refine, verify, ship]
      rationale: "Critical changes coordinate, or they break things quietly."

    - id: RP-FLOOR-002
      when: { familiarity: brownfield-unmapped }
      require_phase: define
      require_skill: behaviour-mapping
      rationale: "You cannot safely change behaviour you have not first written down."

    - id: RP-FLOOR-003
      when: { labels_any: [auth, payments, personal-data, migrations] }
      force_minimum_route: expedition
      rationale: "Domain risk overrides size. A one-line auth change is not small."

    - id: RP-REQUIRE-001
      when: { risk: critical }
      add_gate: verify.analyze
      rationale: "Cross-artifact consistency checked before high-care work lands."

    - id: RP-REQUIRE-002
      when: { labels_any: [auth, payments, personal-data, migrations] }
      add_gate: verify.analyze
      rationale: "Irreversible-surface issues have consistency checked before they ship."

    - id: RP-REQUIRE-003
      when: { risk: [cross-cutting, critical] }
      add_gate: verify.architecture
      rationale: "Architecture checked before cross-cutting or critical changes land."

    - id: RP-REQUIRE-004
      when: { labels_any: [auth, payments, personal-data, migrations] }
      add_gate: verify.architecture
      rationale: "Irreversible-surface issues have architecture checked before they ship."

    # Artifacts are a routed output like gates. A dimension the shape does not
    # know about can earn a document the same way it earns a gate - which is
    # what stops the artifact set being "whatever this shape always writes".
    - id: RP-REQUIRE-005
      when: { labels_any: [auth, payments, personal-data] }
      add_artifact: threat-model
      rationale: "Work on a trust boundary states the threats it considered."

    - id: RP-REQUIRE-006
      when: { labels_any: [migrations] }
      add_artifact: rollback-plan
      rationale: "A change that is hard to undo says in advance how it would be undone."

  # caps - limits on scaling up.
  caps:
    - id: RP-CAP-001
      when: { risk: critical }
      max_worktrees: 1
      rationale: "Coordination risk on critical changes outweighs parallelism."

  # loop_ceilings - how far a multiagent run may go before it stops with a
  # reason. `compass issue subtask` refuses another try or replan past
  # one, and `compass check` refuses to land a subtask past one unless a
  # stop reason with evidence is recorded. For each ceiling the LOWEST limit
  # among the matching rules applies, so a rule can only lower a limit. A
  # ceiling reached is a stop, not a success.
  # The limits are a starting point. Of the 49 subtasks recorded before
  # these rules, 16 went past three tries or two review rounds; the next
  # runs are the measurement that should tune them.
  loop_ceilings:
    - id: RP-LOOP-001
      ceiling: builder_attempts
      limit: 3
      rationale: "A builder that has failed three times needs a new brief or a stop, not a fourth try."
    - id: RP-LOOP-002
      ceiling: review_rounds
      limit: 3
      rationale: "Review rounds past three mean the brief or the plan is wrong; record why before landing."
    - id: RP-LOOP-003
      ceiling: review_rounds
      when: { risk: [trivial, contained] }
      limit: 2
      rationale: "A contained change that has not passed in two rounds needs a recorded reason."
    - id: RP-LOOP-004
      ceiling: replans
      limit: 2
      rationale: "A breakdown replanned twice is not converging; stop and ask."
    - id: RP-LOOP-005
      ceiling: repeated_error
      limit: 3
      rationale: "The same error three times is a failure, not a reason for a fourth attempt."
    # `compass run` (ADR-030): the sessions one unattended run may start,
    # and the minutes it may take. A flag can lower either, never raise it.
    - id: RP-LOOP-006
      ceiling: run_cycles
      limit: 30
      rationale: "One long unattended run loses the thread; a run that has not finished in 30 sessions needs a person."
    - id: RP-LOOP-007
      ceiling: run_minutes
      limit: 240
      rationale: "An unattended run that is still going after four hours is not converging, and is spending money."

  # immovable_gates - review gates no delivery approach may drop.
  # These three are "the default guardrails in review form": every delivery
  # approach's route_shape already includes them, and listing them here means a
  # future custom or tuned approach still cannot drop them. NOTE what is NOT
  # here: verify.regression is route-scoped (quick fix, being atomic+trivial,
  # does not run it - that is quick fix's whole point), and verify.claims is
  # role-scoped (added by RP-ROLE-001 when a marketer is in play, and built
  # into initiative). Immovable means immovable *everywhere* - keep the set to
  # what genuinely is.
  immovable_gates:
    - id: RP-GATE-001
      gate: verify.correctness
      rationale: "Protects the user - the work must satisfy its acceptance criteria."
    - id: RP-GATE-002
      gate: verify.governance
      rationale: "Protects the project's own rules - honours guardrails and strategies."
    - id: RP-GATE-003
      gate: verify.traceability
      rationale: "Protects the audit trail - code -> criterion -> intent stays intact."

  # role_rules - a role's involvement that ENFORCES a gate or a stage block.
  role_rules:
    - id: RP-ROLE-001
      when: { role: product-marketer }
      require_artifact: launch-readiness.md
      gate: verify.claims                # adds the claims gate to the route's set
      block_phase: land
      until: "every claim in positioning.md traces to a passing scenario"
      rationale: "A launch claim with no backing scenario must not ship."
    - id: RP-ROLE-002
      when: { role: product-owner }
      require_artifact: intent.md
      block_phase: plan
      until: "the spec has been checked against intent.md for intent fidelity"
      rationale: "Built-the-thing-right and built-the-right-thing are different checks."

# -----------------------------------------------------------------------------
# Assessment vocabulary - the legal values the assessment may take. The evaluator
# rejects a value outside this vocabulary (a misclassification should fail
# loudly, not route silently).
# -----------------------------------------------------------------------------
assessment_vocabulary:
  risk: [trivial, contained, cross-cutting, critical]
  familiarity: [greenfield, brownfield-mapped, brownfield-unmapped]
  size: [atomic, small, standard, large, product]
  goal: [delivery, exploration]
  urgency: [none, live-defect]
  role: [engineer, product-owner, product-marketer, designer, qa]
  # `labels` is an open list of domain tags - common ones, not exhaustive:
  labels_common: [auth, payments, personal-data, migrations, public-api, infra, ci]

# -----------------------------------------------------------------------------
# Route shapes - the machine-readable mirror of the five reference delivery approaches. The
# approaches/*.md files are the human-readable canonical descriptions; this is what
# `compass approach evaluate` reads to emit the per-stage weight, gate set, and
# subtask ceiling once the final delivery approach is known. The weight ladder for
# force_minimum_route (spike < express < standard < hotfix < expedition) is the
# `weight:` field.
# -----------------------------------------------------------------------------
route_shapes:
  spike:
    weight: 0
    stages: { assess: light, define: collapsed, refine: skipped, plan: collapsed, breakdown: skipped, implement: explore, verify: conclude, ship: graduate-or-discard }
    gates: [spike.conclude]
    subtask_ceiling: 1
    # A spike writes no review document. What it owes is a recorded
    # conclusion - discard, graduate, or defer - and that is typed evidence,
    # not a document. An empty pack here is the honest answer, not a gap.
    artifacts: {}
  express:
    weight: 1
    stages: { assess: full, define: light, refine: collapsed, plan: collapsed, breakdown: skipped, implement: full, verify: light, ship: light }
    gates: [verify.correctness, verify.governance, verify.traceability]
    subtask_ceiling: 1
    # No document beyond `delivery-approach.md`: the manifest's `scenarios:`
    # block and a test-run record already hold what a light
    # acceptance-criteria.md and verification-report.md would repeat - a
    # stated criterion before the code (`G2`) and a recorded green after it
    # (`G1`). So "a quick fix writes delivery-approach.md and nothing else" is
    # a routed decision a check can read, not a convention.
    artifacts: { delivery-approach: light }
  standard:
    weight: 2
    stages: { assess: full, define: full, refine: light, plan: full, breakdown: multiagent, implement: full, verify: full, ship: full }
    gates: [verify.correctness, verify.governance, verify.traceability, verify.regression, verify.clarity, verify.security]
    subtask_ceiling: 2
    # A multiagent breakdown reads a distribution map, so this route earns one.
    artifacts: { acceptance-criteria: full, technical-design: full, distribution-map: light, verification-report: full }
  hotfix:
    weight: 3
    # `full-plus-backfill` below is a stage-weight enum the evaluator
    # and every manifest on disk read; renaming it is a migration with a
    # back-compat shim, not a text sweep.
    # vocabulary-scan: allow - machine enum value, see above
    stages: { assess: light, define: reproduce-first, refine: collapsed, plan: collapsed, breakdown: skipped, implement: expedited, verify: full, ship: full-plus-backfill }
    gates: [verify.correctness, verify.governance, verify.traceability, verify.regression, verify.security]
    subtask_ceiling: 1
    artifacts: { acceptance-criteria: light, verification-report: full }
  expedition:
    weight: 4
    stages: { assess: full, define: full, refine: full, plan: full, breakdown: multiagent, implement: full, verify: full, ship: full }
    gates: [verify.correctness, verify.governance, verify.traceability, verify.regression, verify.security, verify.clarity, verify.claims]
    subtask_ceiling: null
    artifacts: { intent: full, acceptance-criteria: full, requirements-review: full, technical-design: full, distribution-map: full, verification-report: full }
