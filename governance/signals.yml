# governance/signals.yml - pattern defaults for the stop hook's scope-bloat
# prompts and the design patterns the review looks for. Schema: schemas/signals.schema.json.
#
# Projects override by editing their own copy of this file (same pattern as
# guardrails.yml and routing-policy.yml). The framework ships these defaults;
# `/compass:init` copies nothing, so a project that wants different patterns
# adds its own copy of this file.
#

version: 1.0.0

scope_bloat_phrases:
  - "more files than Plan estimated"
  - "narrow scope and spawn sibling"
  - "file deeper layer as a sibling issue at ship"
  - "soften the gate"
  - "(carried to ship)"
  - "USER TO APPLY"

# Advisory patterns assessed by the review at the `verify` stage - judgement,
# never a gate. A match is a prompt to the reviewer to investigate a
# potential sign of a design problem; it does not fail any check. Projects
# extend by editing their
# own copy of signals.yml.
design_smell:
  - "tests dominated by mocking or setup"
  - "assertions on internal method calls"
  - "single test asserts more than one behaviour"
