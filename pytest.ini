[pytest]
# Compass - pytest defaults. `addopts` below disables the cache provider
# only. Plugin autoload - the setting that matters when an external pytest
# plugin (ddtrace, coverage, instrumentation) hangs or takes a very long time
# to initialise in a clean environment - is disabled separately, by
# PYTEST_DISABLE_PLUGIN_AUTOLOAD in `Makefile` and `.github/workflows/compass.yml`.
testpaths = tests
# The repository root on sys.path, so two tests that import from the
# `tests` package work under a bare `pytest`. Without it the suite only
# passes when the caller exports PYTHONPATH first, which nothing says -
# so a clean checkout looks red, and `compass tdd-green -- pytest -q`
# cannot clear the regression gate, because it spawns the command
# without the caller's shell prefix.
pythonpath = .
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
# `serial` marks a test that must not share the CPU: a wall-clock limit fails
# at random under parallel workers. `make test`, release.sh and CI run these
# in a second pass on their own.
markers =
    serial: runs after the parallel pass, on an otherwise idle machine
