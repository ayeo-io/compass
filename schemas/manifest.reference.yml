# Schema reference for: .compass/work/<issue-slug>/manifest.yml
# The manifest. `compass issue lint` enforces this.
# Notation: (required) / (optional); `type`; [enum] where the set is closed.

schema_version:  # (optional, recommended) string - the manifest schema version this file follows
issue:           # (required) string - the issue slug, matches the directory name
created:         # (required) string - ISO date the issue was assessed
status:          # (optional) [active, queued, parked, landed, abandoned] - defaults to active

assessment:        # (required) map - the four-dimension JUDGEMENT assessment (assess)
  risk:  # (required) [trivial, contained, cross-cutting, critical]
  familiarity:       # (required) [greenfield, brownfield-mapped, brownfield-unmapped]
  size:     # (required) [atomic, small, standard, large, product]
  goal:          # (optional) [delivery, exploration]   - defaults to delivery
  urgency:       # (optional) [none, live-defect]        - defaults to none
  role:          # (optional) [engineer, product-owner, product-marketer, designer, qa]
  labels:        # (optional) list of strings - domain tags (auth, payments, …)

generation:      # (optional) integer, at least 0 - the stored generation of configuration the issue runs against; 0 = assessed under 6.x with none yet; absent = pre-6.0.0, reads live governance
config:          # (optional) map - the issue's own configuration layer, an input; it takes effect when approach evaluate --write commits it

delivery_approach:  # (optional until approach evaluate) string - the final delivery approach name
orchestration:       # (optional until approach evaluate) string - solo | pair | multiagent | …
subtask_ceiling: # (optional) integer or null - how many parallel subtasks the delivery approach permits
policy_rules_fired: # (optional) list of maps {id, kind, rationale, changed[]}
stages:          # (optional until approach evaluate) map of stage -> weight string
checkpoints:     # (optional until approach evaluate) list of the stage hand-offs that wait for a person: assess, define, refine, plan

evidence:        # (optional) list of maps - the typed evidence registry gates reference by id:
  - id:          #   (required in entry) string - e.g. EV-001 or EV-A1
    type:        #   (required in entry) [artifact, claim-review, consistency-check,
                 #     command-output, human-approval, manual-review, migration-plan,
                 #     rollback-plan, security-review, spike-conclusion, test-run]
    path:        #   (optional) string - path to the evidence file
    scenario:    #   (optional) string - the scenario id this evidence is for
    check:       #   (optional) string - for manual-review, the judged check this review is for

gates:           # (optional until approach evaluate) list of maps:
  - id:          #   (required in entry) string - e.g. verify.correctness
    status:      #   (required in entry) [pending, pass, fail]
    evidence:    #   (optional) list of strings, or null - evidence ids from the registry above

scenarios:       # (optional until the define stage) list of maps:
  - id:          #   (required in entry) string - stable id, e.g. TRC-001
    title:       #   (optional) string
    intent:      #   (required in entry) string or list of strings - intent id(s) it traces to
    tests:       #   (optional until implement/verify) list of strings - test refs

failure_modes_descoped: # (optional) list of maps - failure modes no scenario covers, written by `compass scenario descope`:
  - mode:        #   (required in entry) string - the input class or failure mode
    reason:      #   (required in entry) string - why no scenario covers it
    recorded:    #   (required in entry) string - ISO date it was recorded

started_at:      # (optional) string - ISO time `compass quick-fix start` ran; where the assess stage ends
finish_started_at: # (optional) string - ISO time `compass quick-fix finish` began; where implement ends
committed_at:    # (optional) string - ISO time `quick-fix finish` recorded usage, just before its commit
usage:           # (optional) map - tokens per stage from the session's Claude Code transcript: session, source, skipped_lines, stages{assess, implement, ...: requests, subagent_requests, input, output, cache_write, cache_read, cost_usd, shared?}; or recorded: false with a fixed reason. Numbers only.
changed_files:   # (optional until implement) list of maps:
  - path:        #   (required in entry) string - the production file path
    scenarios:   #   (required in entry) list of scenario ids it traces to

claims:          # (optional; only when a marketer is in play) list of maps:
  - id:          #   (required in entry) string
    text:        #   (required in entry) string - the public claim
    scenario:    #   (required in entry) string - the backing scenario id

follow_ups:       # (optional) list of maps - work still outstanding:
  - id:          #   (required in entry) string
    description: #   (optional) string
    status:      #   (required in entry) [outstanding, resolved]

reassessments:   # (optional) list of maps - the append-only re-assessment log:
  - from_route:  #   (required in entry) string - the delivery approach before
    to_route:    #   (required in entry) string - the delivery approach after
    reason:      #   (required in entry) string
    date:        #   (optional) string

artifacts:       # (optional) list of maps - the issue's document registry:
  - id:          #   (required in entry) string - e.g. ART-INTENT
    kind:        #   (required in entry) string - what kind of document this is
    status:      #   (required in entry) string
    reason:      #   (required in entry) string - why this document exists, or was deliberately not written
    path:        #   (optional) string - project-root-relative path to the document

# Human approval (guardrail `G5`) is not a separate top-level key: it is a
# `human-approval` entry in the `evidence:` registry above.
