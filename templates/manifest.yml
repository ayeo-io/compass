# =============================================================================
# TEMPLATE: manifest.yml  -  the manifest
# Produced by: the assess stage (creates it), then specify, build and ship fill their parts.
#              Lives at: .compass/work/<issue-slug>/manifest.yml
# =============================================================================
# manifest.yml is the structured counterpart to `acceptance-criteria.md`, the one
# prose document Compass needs. The prose is for humans; this is for the CLI. `compass approach evaluate` reads
# `assessment` and writes `delivery_approach`/`evidence_required`/`gates`;
# `compass check` reads the rest and checks the guardrails.
#
# It is NOT extra process weight you hand-author. Each `compass` verb fills
# its section as a by-product of doing the stage - assess writes the
# assessment, specify adds scenarios, build adds changed_files, and so on. On
# a small change this file stays tiny.
# `compass issue lint` checks it is well-formed.
# =============================================================================

schema_version: "3.0"     # the manifest schema this file follows
                          # '2.0': the v2 vocabulary keys (assessment, labels,
                          #         delivery_approach, stages, follow_ups,
                          #         reassessments). 1.x manifests are read by key
                          #         normalization until migrated.
                          # '3.0': the stored status is only `backlog` (a hold)
                          #         or `done` with a `close_reason`.
issue: "{{ISSUE_SLUG}}"
created: "{{DATE}}"
# No `status` line: an issue in flight stores none. Its state (backlog, ready,
# in-progress, in-review) is read from its records. `compass issue status set`
# stores `backlog` or `done` (with `--close-reason`), and `compass issue
# blocked set` flags an in-progress or in-review issue as blocked.

# --- the delivery approach ---------------------------------------------------
# `assessment` is JUDGMENT - the assess stage (an LLM or a human) produces it.
# Everything below `assessment` is MECHANICAL - the evaluator
# (`compass approach evaluate --write`) computes it deterministically from
# `assessment` + routing-policy.yml.
assessment:
  risk: "{{trivial | contained | cross-cutting | critical}}"
  familiarity: "{{greenfield | brownfield-mapped | brownfield-unmapped}}"
  size: "{{atomic | small | medium | large | product}}"
  goal: "{{delivery | exploration}}"
  urgency: "{{none | live-defect}}"          # optional; omit if none
  labels: []                                 # domain labels: [auth, payments, …]

# --- the request (#356) ------------------------------------------------------
# Who asked for the change and the link to the request. `compass issue link set
# --request <url> --requester <name>` writes it, or `compass quick-fix start`
# with the same flags. The requester is a claim the session records, not an
# approval. The check `request-recorded` fails until both are recorded.
# request:
#   link: "https://github.com/{{OWNER}}/{{REPO}}/issues/{{N}}"
#   requester: "{{who asked}}"
#   recorded_at: "{{ISO-8601 time}}"

generation: 0                # 0 = assessed, no stored configuration yet; the evaluator
                             # (--write) commits generation 1. Absent = a pre-6.0.0 issue.
delivery_approach: null      # filled by the evaluator (--write): delivery or spike
policy_rules_fired: []       # filled by the evaluator - [{id, kind, rationale, changed}]
# evidence_required: the evaluator (--write) writes the list of evidence the
# change owes, such as [scenarios, red-before-green, suite-green, correctness].
# A spike has none. An issue assessed before 9.0.0 has a `stages:` map instead.

# --- evidence (the registry) -----------------------------------------------
# A typed, id-tagged registry of every piece of evidence this issue has.
# Built incrementally: `compass tdd-green --scenario TRC-... -- <cmd>` appends
# a `test-run` entry; reviews and approvals are added by their stage/agent.
# Gates below reference these entries by id - multiple gates can share one
# piece of evidence, and `compass check` checks the *type* each gate
# accepts. Types declared in governance/guardrails.yml.
evidence: []
#  - id: EV-001
#    type: test-run
#    path: evidence/green-TRC-001.json   # scenario-bound; an unbound run
#                                        # writes evidence/green.json
#    scenario: TRC-001

# --- gates -----------------------------------------------------------------
# Seeded by the evaluator (status: pending). Each stage updates the gates it
# clears. `compass check` checks that every `pass` gate references evidence in
# the registry above, of a type that gate accepts. Flip a gate with
# `compass gate pass <id> --evidence <ids>`, which checks the type at
# write time and rejects a mismatch.
# On `--write`, each seeded gate gets an `# accepts: [...]` comment. It
# names the evidence types the gate accepts, so the author knows them
# before running `compass check`.
#   accepts (from guardrails.yml gate_evidence_requirements):
#     verify.correctness -> [test-run]
#     verify.regression  -> [test-run]
#     verify.governance  -> [command-output, manual-review, artifact]
#     verify.claims      -> [claim-review, command-output, artifact]
gates: []
#  - id: verify.correctness
#    # accepts: ['test-run']
#    status: pending          # pending | pass | fail
#    evidence: []             # evidence ids from the registry above

# --- scenarios (filled when acceptance criteria are defined) ----------------
# The machine-readable index of acceptance-criteria.md. Each scenario gets a
# stable id, a linked intent id, and the test(s) that exercise it.
scenarios: []
#  - id: TRC-001
#    title: "Finance exports the month-end ledger"
#    intent: INT-1            # traces to an Intent links row of the spec
#    tests:
#      - "tests/api/test_ledger_export.py::test_excludes_drafts"

# --- changed_files (filled during build) -----------------------------------
# Every production file the issue changes, each traced to >=1 scenario id.
# This is the code -> criterion half of the traceability guardrail.
changed_files: []
#  - path: "src/api/ledger_export.py"
#    scenarios: [TRC-001]

# --- claims (optional - only when the change makes a public claim) ------------
# Every public/marketing claim, each traced to a backing scenario id.
# This is the claim -> criterion half of the traceability guardrail.
claims: []
#  - id: CLM-001
#    text: "Export your month-end ledger in seconds"
#    scenario: TRC-001

# --- repairs (hotfixes only) -------------------------------------------------
# The slug of the issue this hotfix repairs. Optional.
# repairs: the-issue-this-fixes

# --- follow_ups (work deferred - e.g. a hotfix's, or de-scoped work) ---------
# `compass check` fails while any follow-up is outstanding. Shipping refuses to
# close the issue.
follow_ups: []
#  - id: FU-001
#    description: "Promote the reproduction test into a real scenario"
#    status: "{{outstanding | resolved}}"

# --- reassessments (the assess stage's feedback signal) ----------------------
# Append-only. `compass approach evaluate --write` adds an entry here whenever
# it computes a delivery approach that differs from the one already recorded
# - i.e. a re-assessment - with the reason it changed. A re-assessment is a
# normal event.
reassessments: []
#  - from_route: express
#    to_route: standard
#    reason: "Implementation revealed the change spanned three modules, not one."
#    date: "{{ISO date}}"

# --- failure modes de-scoped at specify ---------------------------------------
# A failure mode or input class the brief implies that no scenario covers, with
# the reason, written by `compass scenario descope`. `/compass:ship` lists
# each in its hand-off. Optional; no gate reads it.
failure_modes_descoped: []
