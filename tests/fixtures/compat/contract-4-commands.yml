  exit: 0
  stdout_contains: "recorded as quick fix"
- id: quick-fix-start-no-reason
  project: empty
  argv: ["quick-fix", "start", "greet", "--risk", "trivial", "--familiarity", "brownfield-mapped - the file and its test exist", "--size", "atomic - one line", "--intent", "the greeting reads correctly", "--scenario", "Given the greeting, when read, then it says hello", "--test", "tests/test_greeting.py"]
  exit: 2
- id: quick-fix-start-unknown-value
  project: empty
  argv: ["quick-fix", "start", "greet", "--risk", "trivial - a one-line text change", "--familiarity", "brownfield-mapped - the file and its test exist", "--size", "tiny - one line", "--intent", "the greeting reads correctly", "--scenario", "Given the greeting, when read, then it says hello", "--test", "tests/test_greeting.py"]
