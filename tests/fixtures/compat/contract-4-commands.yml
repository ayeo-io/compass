- id: quick-fix-start-auth-label
  project: empty
  argv: ["quick-fix", "start", "login", "--risk", "trivial - a one-line text change", "--familiarity", "brownfield-mapped - the file and its test exist", "--size", "atomic - one line", "--intent", "the greeting reads correctly", "--scenario", "Given the greeting, when read, then it says hello", "--test", "tests/test_greeting.py", "--labels", "auth"]
  exit: 1
  stdout_contains: "computes to full"
- id: quick-fix-start-bad-slug
  project: empty
  argv: ["quick-fix", "start", "a/b", "--risk", "trivial - a one-line text change", "--familiarity", "brownfield-mapped - the file and its test exist", "--size", "atomic - one line", "--intent", "the greeting reads correctly", "--scenario", "Given the greeting, when read, then it says hello", "--test", "tests/test_greeting.py"]
  exit: 2
- id: tdd-red-passing-command
  project: quick-fix-started
  argv: ["tdd-red", "--scenario", "TRC-001", "--", "true"]
  exit: 2
- id: tdd-red-unknown-scenario
  project: quick-fix-started
  argv: ["tdd-red", "--scenario", "TRC-999", "--", "false"]
  exit: 2
- id: tdd-red-no-command
  project: quick-fix-started
  argv: ["tdd-red", "--scenario", "TRC-001"]
  exit: 2
- id: tdd-red-no-issue
  project: initialised
  argv: ["tdd-red", "--", "false"]
  exit: 2
- id: tdd-green-no-red-on-record
  project: quick-fix-started
  argv: ["tdd-green", "--scenario", "TRC-001", "--", "false"]
  exit: 2
- id: gate-pass-wrong-evidence-type
  project: quick-fix-with-note
  argv: ["gate", "pass", "verify.correctness", "--evidence", "EV-1"]
  exit: 2
- id: gate-pass-accepted-type
  project: quick-fix-with-note
  argv: ["gate", "pass", "verify.governance", "--evidence", "EV-1"]
  exit: 0
  stdout_contains: "verify.governance -> pass"
- id: gate-pass-unknown-evidence
  project: quick-fix-with-note
  argv: ["gate", "pass", "verify.governance", "--evidence", "EV-9"]
  exit: 2
- id: gate-pass-gate-not-in-set
  project: quick-fix-with-note
  argv: ["gate", "pass", "verify.security", "--evidence", "EV-1"]
  exit: 2
- id: evidence-add-valid
  project: quick-fix-started
  argv: ["evidence", "add", "EV-1", "--type", "artifact", "--path", "evidence/note.md"]
  exit: 0
- id: evidence-add-unknown-type
  project: quick-fix-started
  argv: ["evidence", "add", "EV-1", "--type", "rumour", "--path", "evidence/note.md"]
  exit: 2
- id: evidence-add-missing-file
  project: quick-fix-started
  argv: ["evidence", "add", "EV-1", "--type", "artifact", "--path", "nope.txt"]
  exit: 2
# Added on purpose by judged-checks: `evidence review` is a new leaf of the
# evidence group. 5.6.0 refused it as an unknown choice (exit 2). From 6.0.0 it
# records a judgement against a judged check whose input exists, and exits 0.
- id: evidence-review-recorded
  project: with-judged-check-document
  argv: ["evidence", "review", "design-review", "--verdict", "pass", "--reason", "Read in full.", "--reviewer", "jed72"]
  exit: 0
  stdout_contains: "design-review - pass recorded"
# Added on purpose by judged-checks: a check the configuration does not define
# is refused (exit 2) and nothing is written. The exit code equals what 5.6.0
# gave for the unknown choice, but the cause is now the missing check.
- id: evidence-review-unknown-check
  project: regular-issue
  argv: ["evidence", "review", "no-such-check", "--verdict", "pass", "--reason", "Read in full.", "--reviewer", "jed72"]
  exit: 2
# Added on purpose by judged-checks: only a judged check takes a review. A
# human check is refused (exit 2), so a tick cannot be replaced by a record.
- id: evidence-review-not-judged
  project: with-judged-check-document
  argv: ["evidence", "review", "dor-summary-filled", "--verdict", "pass", "--reason", "Read in full.", "--reviewer", "jed72"]
  exit: 2
# Added on purpose by judged-checks: a review of a document that is not there
# is refused (exit 2). A record of inputs that cannot be found would match
# nothing later.
- id: evidence-review-input-missing
  project: with-judged-check
  argv: ["evidence", "review", "design-review", "--verdict", "pass", "--reason", "Read in full.", "--reviewer", "jed72"]
  exit: 2
# Added on purpose by artifact-freshness, which reads a project's capability
# `artifact-freshness`. The four entries below run in one project: a regular
# issue at implement, the capability on, and a design written before its
# acceptance criteria changed. The exit codes are the ones the 5.6.0 CLI gave
# in the same project, measured by running it there. What is new is the
# phrase each entry names, so the entry fails when the reader is lost. The
# `check` and `issue receipt` entries name a phrase that only a stale design
# produces, not the guardrail name or the section heading, which a fresh
# design produces too. `check` exits 1 at 5.6.0 too, for scenarios with no
# id, so the exit code alone does not show the stale design: the phrase does.
- id: check-stale-document
  project: with-stale-document
  argv: ["check", "--issue", "feature", "--json"]
  exit: 1
  stdout_contains: "stale - acceptance-criteria changed"
- id: next-stale-document
  project: with-stale-document
  argv: ["next", "--issue", "feature"]
  exit: 0
  stdout_contains: "entry not met: technical-design is stale"
- id: receipt-stale-document
  project: with-stale-document
  argv: ["issue", "receipt", "--issue", "feature"]
  exit: 0
  stdout_contains: "stale - acceptance-criteria changed"
- id: artifact-records-digests
  project: with-stale-document
  argv: ["issue", "artifact", "acceptance-criteria", "--status", "draft", "--issue", "feature"]
  exit: 0
  stdout_contains: "freshness: digest recorded"
# Added on purpose by human-check-approvers: `evidence approve` is a new leaf of
# the evidence group. 5.6.0 refused it as an unknown choice (exit 2). From 6.0.0
# it records a person's approval from a terminal. The corpus runs without a
# terminal that it controls, so both entries are refusals whether or not one is
# attached: a check the configuration does not define, and the approver agent.
- id: evidence-approve-unknown-check
  project: regular-issue
  argv: ["evidence", "approve", "--check", "no-such-check", "--approver", "jed72", "--role", "owner", "--scope", "the plan"]
  exit: 2
- id: evidence-approve-agent-refused
  project: regular-issue
  argv: ["evidence", "approve", "--check", "dor-summary-filled", "--approver", "agent", "--role", "owner", "--scope", "the plan"]
  exit: 2
- id: changed-file-add-valid
  project: quick-fix-started
  argv: ["changed-file", "add", "README.md", "--scenario", "TRC-001"]
  exit: 0
- id: changed-file-add-unknown-scenario
  project: quick-fix-started
  argv: ["changed-file", "add", "README.md", "--scenario", "TRC-999"]
  exit: 2
- id: scenario-add-valid
  project: quick-fix-started
  argv: ["scenario", "add", "TRC-002", "--intent", "INT-1", "--title", "a second case", "--test", "tests/test_greeting.py"]
  exit: 0
- id: scenario-add-duplicate
  project: quick-fix-started
  argv: ["scenario", "add", "TRC-001", "--intent", "INT-1"]
  exit: 2
# Added on purpose by scenario-tests-verb: `scenario tests` is a new verb. 5.6.0
# refused it as an unknown choice (exit 2); from 6.0.0 it replaces the tests a
# scenario declares and exits 0.
- id: scenario-tests-valid
  project: quick-fix-started
  argv: ["scenario", "tests", "TRC-001", "--test", "README.md"]
  exit: 0
  stdout_contains: "now declares 1 test"
# Added on purpose by scenario-tests-verb: an unknown scenario exits 2. 5.6.0
# also exited 2, for the unknown verb, so this guards that the new verb keeps
# refusing a scenario the issue does not define.
- id: scenario-tests-unknown-scenario
  project: quick-fix-started
  argv: ["scenario", "tests", "TRC-999", "--test", "README.md"]
  exit: 2
# Added on purpose by scenario-tests-verb: a test id that is not on disk exits
# 2. 5.6.0 also exited 2, for the unknown verb, so this guards that the new verb
# refuses an id that `declared-tests-resolve` would fail.
- id: scenario-tests-unresolved
  project: quick-fix-started
  argv: ["scenario", "tests", "TRC-001", "--test", "tests/test_greeting.py::test_hello"]
  exit: 2
# Added on purpose by scenario-tests-verb: a call with no --test exits 2. 5.6.0
# also exited 2, for the unknown verb, so this guards that the new verb does not
# clear a scenario's declared tests.
- id: scenario-tests-no-test
  project: quick-fix-started
  argv: ["scenario", "tests", "TRC-001"]
  exit: 2
- id: follow-up-resolve-unknown
  project: quick-fix-started
  argv: ["follow-up", "resolve", "FU-1", "--issue", "greet"]
  exit: 2
- id: acceptance-start-validation
  project: quick-fix-started
  argv: ["acceptance", "start", "--kind", "validation", "--", "true"]
  exit: 0
- id: acceptance-start-no-command
  project: quick-fix-started
  argv: ["acceptance", "start", "--kind", "validation"]
  exit: 2
- id: acceptance-start-unknown-kind
  project: quick-fix-started
  argv: ["acceptance", "start", "--kind", "vibes", "--", "true"]
  exit: 2
- id: acceptance-start-no-issue
  project: initialised
  argv: ["acceptance", "start", "--kind", "validation", "--", "true"]
  exit: 2
- id: policy-lint-shipped
  project: initialised
  argv: ["policy", "lint"]
  exit: 0
  stdout_contains: "PASS"
- id: policy-lint-copied
  project: with-copied-governance
  argv: ["policy", "lint"]
  exit: 0
  stdout_contains: "PASS"
- id: policy-lint-broken
  project: with-broken-governance
  argv: ["policy", "lint"]
  exit: 1
  stdout_contains: "FAIL"
# Added on purpose by policy-lint: `policy effective` is a new verb. 5.6.0
# refused it as an unknown choice (exit 2); from 6.0.0 it prints the resolved
# configuration and exits 0.
- id: policy-effective-shipped
  project: initialised
  argv: ["policy", "effective"]
  exit: 0
  stdout_contains: "default@6.0.0"
# Added on purpose by policy-lint: a root compass.yml that Compass reads is
# now linted layer by layer. 5.6.0 did not read the file, so it ran the legacy
# lint and passed.
- id: policy-lint-layered
  project: with-compass-yml
  argv: ["policy", "lint"]
  exit: 0
  stdout_contains: "PASS"
# Added on purpose by policy-lint: a compass.yml with a schema fault now fails
# the lint (exit 1). 5.6.0 did not read the file and exited 0.
- id: policy-lint-layered-broken
  project: with-broken-compass-yml
  argv: ["policy", "lint"]
  exit: 1
  stdout_contains: "FAIL"
# Added on purpose by policy-diff: `policy diff` is a new verb. 5.6.0 refused it
# as an unknown choice (exit 2); from 6.0.0 two identical configurations print
# that there is no difference and exit 0.
- id: policy-diff-identical
  project: initialised
  argv: ["policy", "diff", "default@6", "project"]
  exit: 0
  stdout_contains: "no difference"
# Added on purpose by policy-diff: `--exit-code` exits 1 only when something
# differs, so identical configurations still exit 0.
- id: policy-diff-identical-exit-code
  project: initialised
  argv: ["policy", "diff", "--exit-code", "default@6", "project"]
  exit: 0
# Added on purpose by policy-diff: a reference that is neither a keyword nor a
# file exits 2. 5.6.0 also exited 2, for the unknown verb, so this guards that
# the new verb keeps refusing what it cannot read.
- id: policy-diff-bad-reference
  project: initialised
  argv: ["policy", "diff", "nonsense"]
  exit: 2
# Added on purpose by policy-diff: a project file that loosens a shipped check
# is a difference, so `--exit-code` exits 1. Without the flag the same command
# exits 0: `policy diff` reports what differs and leaves the failure to the
# flag, unlike `policy lint`, which judges and exits 1 on FAIL.
- id: policy-diff-differs-exit-code
  project: with-looser-compass-yml
  argv: ["policy", "diff", "--exit-code", "default@6", "project"]
  exit: 1
  stdout_contains: "loosening"
# Added on purpose by impl-refusal: `issue migrate-config` is a new verb. 5.6.0
# refused it as an unknown choice (exit 2); from 6.0.0 an issue whose generation
# already holds the installed versions is left as it is, and the verb says so and
# exits 0.
- id: issue-migrate-config-already-pinned
  project: regular-issue
  argv: ["issue", "migrate-config"]
  exit: 0
  stdout_contains: "no change"
# Added on purpose by impl-refusal: with no current issue the new verb exits 2.
# 5.6.0 also exited 2, for the unknown verb, so this guards that the new verb
# refuses to guess which issue to change.
- id: issue-migrate-config-no-issue
  project: initialised
  argv: ["issue", "migrate-config"]
  exit: 2
# Added on purpose by policy-migrate: `policy migrate` is a new verb. 5.6.0
# refused it as an unknown choice (exit 2). From 6.0.0 it is a dry run on a
# project with copied governance: an unchanged copy gives an empty overlay,
# shown equivalent, and exits 0 without writing a file.
- id: policy-migrate-copied
  project: with-copied-governance
  argv: ["policy", "migrate"]
  exit: 0
  stdout_contains: "dry run"
# Added on purpose by policy-migrate: a project with nothing to migrate is not
# an error. 5.6.0 exited 2 on the unknown verb; from 6.0.0 it says so and
# exits 0.
- id: policy-migrate-nothing
  project: initialised
  argv: ["policy", "migrate"]
  exit: 0
  stdout_contains: "nothing to migrate"
# Added on purpose by policy-migrate: a project that already has a compass.yml
# is refused (exit 2) and nothing is written. The exit code equals what 5.6.0
# gave for the unknown verb, but the cause is now the refusal, not the parser.
- id: policy-migrate-refused
  project: with-compass-yml
  argv: ["policy", "migrate"]
  exit: 2
# Added on purpose by git-parents: `policy lint --offline` is a new flag. 5.6.0
# refused it as an unrecognised argument (exit 2). From 6.0.0 it lints from the
# cache only and, in a project with no git parent, passes (exit 0).
- id: policy-lint-offline
  project: with-compass-yml
  argv: ["policy", "lint", "--offline"]
  exit: 0
  stdout_contains: "PASS"
# Added on purpose by git-parents: a compass.yml whose extends names a remote
# ref with no sha now fails the lint (exit 1) and runs no git. 5.6.0 did not
# read the file and exited 0.
- id: policy-lint-git-parent-no-sha
  project: with-git-parent-no-sha
  argv: ["policy", "lint"]
  exit: 1
  stdout_contains: "L-PARENT-NO-SHA"
# Added on purpose by git-parents: a pinned git parent that is not in the cache
# fails with --offline (exit 1), because the run may not fetch. 5.6.0 did not
# read the file and exited 0.
- id: policy-lint-git-parent-uncached-offline
  project: with-git-parent-uncached
  argv: ["policy", "lint", "--offline"]
  exit: 1
  stdout_contains: "L-PARENT-NOT-CACHED"
# Added on purpose by policy-test-init-preset: `policy test` is a new verb. 5.6.0
# refused it as an unknown choice (exit 2). From 6.0.0 it runs the fixtures of
# the preset folder given and exits 0 when the lint and every fixture pass.
- id: policy-test-passes
  project: with-preset
  argv: ["policy", "test", "team-preset"]
  exit: 0
  stdout_contains: "PASS"
# Added on purpose by policy-test-init-preset: a fixture whose expected approach
# differs from the computed one fails the run (exit 1). 5.6.0 exited 2 on the
# unknown verb.
- id: policy-test-fails
  project: with-failing-preset
  argv: ["policy", "test", "team-preset"]
  exit: 1
  stdout_contains: "expected full"
# Added on purpose by policy-test-init-preset: a working folder with no compass.yml
# is an input error (exit 2). The exit code equals what 5.6.0 gave for the unknown
# verb, but the cause is now the missing file, not the parser.
- id: policy-test-no-preset
  project: initialised
  argv: ["policy", "test"]
  exit: 2
  stderr_contains: "no compass.yml here"
# Added on purpose by policy-test-init-preset: `policy init-preset` is a new
# verb. 5.6.0 refused it as an unknown choice (exit 2). From 6.0.0 it writes a
# preset into a new folder and exits 0.
- id: policy-init-preset-writes
  project: initialised
  argv: ["policy", "init-preset", "team-preset", "--owner", "acme-team"]
  exit: 0
  stdout_contains: "wrote a preset"
# Added on purpose by policy-test-init-preset: a folder that already holds one of
# the preset's files is refused (exit 1) and nothing is written. 5.6.0 exited 2
# on the unknown verb.
- id: policy-init-preset-refused
  project: with-preset
  argv: ["policy", "init-preset", "team-preset", "--owner", "acme-team"]
  exit: 1
  stdout_contains: "refused"
# Added on purpose by preset-interfaces: a folder inside compass-fixtures/ is a
# fixture group, so its fixtures run and the text report counts the group. 5.6.0
# exited 2 on the unknown verb. policy-test-init-preset reported such a folder
# as a problem and exited 1.
- id: policy-test-groups
  project: with-grouped-preset
  argv: ["policy", "test", "team-preset"]
  exit: 0
