  argv: ["issue", "template", "verification-report", "--issue", "feature", "--json"]
  exit: 0
  stdout_contains: "\"kind\": \"verification-report\""
# Added on purpose by templates-render-lists: a kind that is not a template is
# refused. 5.6.0 exited 2 on the unknown verb; from 6.0.0 it exits 2 and names
# the templates.
- id: issue-template-unknown-kind
  project: regular-issue
  argv: ["issue", "template", "no-such-template", "--issue", "feature"]
  exit: 2
