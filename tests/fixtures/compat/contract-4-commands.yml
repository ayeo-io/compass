# Contract 4: the CLI's exit codes on a recorded command corpus.
#
# Each entry names a project state that tests/compat_commands.py builds, the
# arguments given to the CLI in it, and the exit code 5.6.0 gave. The exit
# codes were captured once by `capture()` and must never be regenerated by
# running newer code. A changed exit code is a change in behaviour to
# explain, not a fixture to refresh.

entries:
- id: approach-evaluate-quick-fix
  project: initialised
  argv: ["approach", "evaluate", "--assessment", "risk=trivial", "--assessment", "familiarity=brownfield-mapped", "--assessment", "size=atomic"]
  exit: 0
  stdout_contains: "quick fix - 3 gate(s)"
- id: approach-evaluate-no-compass-folder
  project: empty
  argv: ["approach", "evaluate", "--assessment", "risk=trivial", "--assessment", "familiarity=brownfield-mapped", "--assessment", "size=atomic"]
  exit: 0
  stdout_contains: "quick fix - 3 gate(s)"
- id: approach-evaluate-copied-governance
  project: with-copied-governance
  argv: ["approach", "evaluate", "--assessment", "risk=contained", "--assessment", "familiarity=brownfield-mapped", "--assessment", "size=standard"]
  exit: 0
  stdout_contains: "regular - 6 gate(s)"
- id: approach-evaluate-controlled-autonomy
  project: with-config
  argv: ["approach", "evaluate", "--assessment", "risk=contained", "--assessment", "familiarity=brownfield-mapped", "--assessment", "size=standard"]
  exit: 0
  stdout_contains: "regular - 6 gate(s)"
- id: approach-evaluate-unknown-value
  project: initialised
  argv: ["approach", "evaluate", "--assessment", "risk=enormous", "--assessment", "familiarity=brownfield-mapped", "--assessment", "size=atomic"]
  exit: 2
- id: approach-evaluate-write-ad-hoc
  project: initialised
  argv: ["approach", "evaluate", "--write", "--assessment", "risk=trivial", "--assessment", "familiarity=brownfield-mapped", "--assessment", "size=atomic"]
  exit: 2
- id: approach-evaluate-no-issue
  project: initialised
  argv: ["approach", "evaluate"]
  exit: 2
- id: approach-evaluate-broken-governance
  project: with-broken-governance
  argv: ["approach", "evaluate", "--assessment", "risk=contained", "--assessment", "familiarity=brownfield-mapped", "--assessment", "size=standard"]
  exit: 2
