# Added on purpose by generation-store: the state's own `approach evaluate
# --write` committed generation 1, so a second run finds the stored
# configuration equal and commits nothing. 5.6.0 exited 0 and so does this.
- id: approach-evaluate-write-again-commits-nothing
  project: regular-issue
  argv: ["approach", "evaluate", "--issue", "feature", "--write"]
  exit: 0
  stdout_contains: "no change"
# Added on purpose by generation-store: `approach evaluate --write` stores the
# configuration the issue resolves to, so it refuses a project whose
# compass.yml the lint rejects, before it writes anything. 5.6.0 did not read
# the file and exited 0.
- id: approach-evaluate-write-refuses-a-broken-compass-yml
  project: regular-issue-broken-compass-yml
  argv: ["approach", "evaluate", "--issue", "feature", "--write"]
  exit: 2
# Added on purpose by templates-render-lists: `issue template` is a new verb.
# 5.6.0 refused it as an unknown choice (exit 2); from 6.0.0 it prints the
# document template with its checklists rendered from the issue's stage lists
# and exits 0. The shipped default renders the template file unchanged.
- id: issue-template-requirements-review
  project: regular-issue
  argv: ["issue", "template", "requirements-review", "--issue", "feature"]
  exit: 0
  stdout_contains: "Definition of Ready"
- id: issue-template-verification-report-json
  project: regular-issue
  argv: ["issue", "template", "verification-report", "--issue", "feature", "--json"]
  exit: 0
  stdout_contains: "\"kind\": \"verification-report\""
# Added on purpose by templates-render-lists: this entry pins the exit code of
# the refusal only. 5.6.0 exited 2 on the unknown verb; from 6.0.0 the verb
# exists and exits 2 for a kind that is not a template. The message is not
# pinned here.
- id: issue-template-unknown-kind
  project: regular-issue
  argv: ["issue", "template", "no-such-template", "--issue", "feature"]
  exit: 2
# Added on purpose by configure-and-reassess: `issue configure` is a new verb.
# 5.6.0 refused it as an unknown choice (exit 2). From 6.0.0 a change that
# the layered lint accepts is parked as a proposal in the next generation's
# folder, the manifest is untouched, and the command exits 0.
- id: issue-configure-proposes-a-change
  project: regular-issue
  argv: ["issue", "configure", "--issue", "feature", "--mode", "refine=full"]
  exit: 0
  stdout_contains: "verdict          : accepted"
# Added on purpose by configure-and-reassess: a proposal that loosens a stage
# without a waiver is still written, and the command exits 1 so a script can
# see that a reassess would refuse it. 5.6.0 had no such verb and exited 2.
- id: issue-configure-refused-proposal-exits-1
  project: regular-issue
  argv: ["issue", "configure", "--issue", "feature", "--mode", "define=collapsed"]
  exit: 1
  stdout_contains: "verdict          : refused"
# Added on purpose by configure-and-reassess: a call that names no change is
# an error. 5.6.0 also exited 2, as an unknown choice; from 6.0.0 the verb
# exists and exits 2 because it was given nothing to propose.
- id: issue-configure-no-change-given
  project: regular-issue
  argv: ["issue", "configure", "--issue", "feature"]
  exit: 2
# Added on purpose by configure-and-reassess: --discard with no proposal and
# no leftover folder is an error and removes nothing. 5.6.0 also exited 2, as
# an unknown choice.
- id: issue-configure-discard-nothing
  project: regular-issue
  argv: ["issue", "configure", "--issue", "feature", "--discard"]
  exit: 2
# Added on purpose by configure-and-reassess: `approach evaluate --reset-config`
# is a new flag. Without --write it has nothing to drop the layer from and is
# refused; 5.6.0 rejected the flag as unrecognised (exit 2).
- id: approach-evaluate-reset-config-needs-write
  project: regular-issue
  argv: ["approach", "evaluate", "--issue", "feature", "--reset-config"]
  exit: 2
# Added on purpose by configure-and-reassess: with --write, --reset-config
# drops the issue's config: layer in the reassess it commits. This issue has
# none, so the generation holds the same configuration and the command exits 0
# and says "no change". 5.6.0 rejected the flag (exit 2).
- id: approach-evaluate-write-reset-config
  project: regular-issue
  argv: ["approach", "evaluate", "--issue", "feature", "--write", "--reset-config"]
  exit: 0
  stdout_contains: "no change"
