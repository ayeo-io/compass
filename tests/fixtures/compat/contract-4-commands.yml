- id: quick-fix-start-heavier
  project: empty
  argv: ["quick-fix", "start", "bigger", "--risk", "contained - touches a module", "--familiarity", "brownfield-mapped - the file and its test exist", "--size", "standard - several files", "--intent", "the greeting reads correctly", "--scenario", "Given the greeting, when read, then it says hello", "--test", "tests/test_greeting.py"]
  exit: 1
