# Added on purpose by generation-store: the state's own `approach evaluate
# --write` committed generation 1, so a second run finds the stored
# configuration equal and commits nothing. 5.6.0 exited 0 and so does this.
- id: approach-evaluate-write-again-commits-nothing
  project: regular-issue
  argv: ["approach", "evaluate", "--issue", "feature", "--write"]
  exit: 0
  stdout_contains: "no change"
# Added on purpose by generation-store: `approach evaluate --write` stores the
# configuration the issue resolves to, so it refuses a project whose
# compass.yml the lint rejects, before it writes anything. 5.6.0 did not read
# the file and exited 0.
- id: approach-evaluate-write-refuses-a-broken-compass-yml
  project: regular-issue-broken-compass-yml
  argv: ["approach", "evaluate", "--issue", "feature", "--write"]
  exit: 2
# Added on purpose by templates-render-lists: `issue template` is a new verb.
# 5.6.0 refused it as an unknown choice (exit 2); from 6.0.0 it prints the
# document template with its checklists rendered from the issue's stage lists
# and exits 0. The shipped default renders the template file unchanged.
- id: issue-template-requirements-review
  project: regular-issue
  argv: ["issue", "template", "requirements-review", "--issue", "feature"]
  exit: 0
  stdout_contains: "Definition of Ready"
- id: issue-template-verification-report-json
