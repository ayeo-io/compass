# What compass next, issue lint, flow and flow --json printed
# on the project that build_dbi5_project in
# tests/test_issue_dependencies.py writes, captured from the code before
# depends_on existed, under a fixed clock. The project's own folder reads
# <ROOT> and the board page's Generated line is masked. 9.0.0 renders no issue
# page (ADR-091), so the issue render captures are gone, and compass next names
# assess, not delivery-approach.md, for an issue with no approach. On the
# four-stage path (ADR-092) compass next shows each legacy stage as the path
# stage it maps to and adds a next: part; the next-*.txt lines were edited so.
# 9.0.0 removed the board page and the flow board's friction line (ADR-093), so
# the board render captures are gone and that line was cut from flow.txt and
# flow-json.txt.
