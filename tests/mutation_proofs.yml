# Mutation proofs for every check under `checks:` in
# governance/presets/default/checks.yml (governance/guardrails.yml is generated
# from it).
#
# The mutation-proof strategy in governance/strategies.md accepts a guard only
# on a demonstrated failure. Here a proof is a pair of tests that run on
# every suite: `fails` feeds the check a broken input and asserts it fails;
# `restores` asserts it passes once the input is put right (it may be the
# same test when that test asserts both). `broken` says what the failing test
# breaks. `record`, where present, names an older written proof that broke
# the check's own code; it is for a reader, and the register test does not
# open it.
#
# tests/test_mutation_proof_register.py fails when a check has no entry, an
# entry is missing a field, an entry names a check that is gone, or a test
# named here does not exist. .github/scripts/check_mutation_runner.py, run by
# the check-mutation CI job, breaks each check in a copy of the checkout and
# fails when its `fails` or `restores` test does not go red.

- check: borrowed-documents-answered
  broken: a threat in the threat model with no scenario or accepted risk
  fails: tests/test_borrowed_document_shapes.py::test_trc_a2
  restores: tests/test_borrowed_document_shapes.py::test_trc_a2
  record: .compass/work/adaptive-artifact-composition/evidence/mutation-round.txt

